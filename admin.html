
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Safety Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <h2>FAMILY <span>SAFETY</span></h2>
    <p class="side-label">MENU UTAMA</p>
    <a class="active" href="#dashboard">▦ Dashboard</a>
    <a href="#devices">▣ Perangkat</a>
    <a href="#locations">⌖ Lokasi</a>
    <a href="#notifications">♧ Notifikasi</a>
  </aside>

  <main class="main" id="dashboard">
    <header>
      <div>
        <h1>Dashboard Admin</h1>
        <p>Family Safety Monitor</p>
      </div>
      <button onclick="loadData()">↻ Refresh</button>
    </header>

    <section class="login-panel">
      <h3>Akses Admin</h3>
      <input type="password" id="adminToken"
      placeholder="Token admin">
      <button onclick="login()">Hubungkan</button>
      <p id="loginStatus"></p>
    </section>

    <div class="stats">
      <div class="stat"><small>Total Perangkat</small><h2 id="total">0</h2></div>
      <div class="stat"><small>Laporan Lokasi</small><h2 id="locationsCount">0</h2></div>
      <div class="stat"><small>Notifikasi</small><h2 id="notificationsCount">0</h2></div>
    </div>

    <section class="panel" id="devices">
      <h3>Daftar Perangkat</h3>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nama</th><th>ID</th><th>Status</th><th>Izin</th>
          </tr></thead>
          <tbody id="deviceRows">
            <tr><td colspan="4">Silakan login.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="locations">
      <h3>Riwayat Lokasi</h3>
      <div id="locationRows">Belum ada data.</div>
    </section>

    <section class="panel" id="notifications">
      <h3>Notifikasi</h3>
      <div id="notificationRows">Belum ada data.</div>
    </section>

    <p id="dbStatus"></p>
  </main>
</div>

<script>
const API_URL = "https://GANTI-DENGAN-DOMAIN-BACKEND/api";
let token = "";
let timer = null;

function login() {
  token = document.getElementById("adminToken").value.trim();
  if (!token) return alert("Masukkan token admin.");

  loadData();

  if (timer) clearInterval(timer);
  timer = setInterval(loadData, 15000);
}

async function loadData() {
  const status = document.getElementById("dbStatus");
  status.textContent = "Memuat database...";

  try {
    const response = await fetch(`${API_URL}/admin/data`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (!response.ok) throw new Error("Akses gagal atau server tidak tersedia.");

    const data = await response.json();

    const devices = data.devices || [];
    const locations = data.location_reports || [];
    const notifications = data.notifications || [];

    document.getElementById("total").textContent = devices.length;
    document.getElementById("locationsCount").textContent = locations.length;
    document.getElementById("notificationsCount").textContent = notifications.length;

    document.getElementById("deviceRows").innerHTML =
      devices.length ? devices.map(d => `
        <tr>
          <td>${esc(d.name)}</td>
          <td>${esc(d.id)}</td>
          <td>${esc(d.status)}</td>
          <td>${d.consent ? "Disetujui" : "Tidak aktif"}</td>
        </tr>
      `).join("") : '<tr><td colspan="4">Belum ada perangkat.</td></tr>';

    document.getElementById("locationRows").innerHTML =
      locations.length ? locations.slice().reverse().map(l => `
        <div class="report">
          <b>${esc(l.device_name)}</b>
          <p>${Number(l.latitude)}, ${Number(l.longitude)}</p>
          <small>${esc(l.timestamp)}</small><br>
          <a target="_blank" rel="noopener"
          href="https://www.google.com/maps?q=${Number(l.latitude)},${Number(l.longitude)}">
          Lihat Peta</a>
        </div>
      `).join("") : "Belum ada laporan.";

    document.getElementById("notificationRows").innerHTML =
      notifications.length ? notifications.slice().reverse().map(n => `
        <div class="report">
          <b>${esc(n.title)}</b>
          <p>${esc(n.message)}</p>
          <small>${esc(n.timestamp)}</small>
        </div>
      `).join("") : "Belum ada notifikasi.";

    status.textContent = "Database berhasil dimuat.";
    document.getElementById("loginStatus").textContent = "Admin terhubung.";

  } catch (error) {
    status.textContent = error.message;
    document.getElementById("loginStatus").textContent = "Gagal terhubung.";
  }
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
</script>
</body>
</html>
