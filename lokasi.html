<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Lokasi</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f5f9; padding: 16px; color: #0f172a; }
    .wrap { max-width: 600px; margin: 0 auto; }
    .card { background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .time { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .coord { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .btn { display: inline-block; padding: 8px 14px; background: #118EE9; color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Riwayat Link Lokasi</h2>
    <div id="listLokasi">Memuat data...</div>
  </div>

  <script>
    async function muatLokasi() {
      const container = document.getElementById('listLokasi');
      try {
        // Tambahkan ?t=Date.now() agar tidak terkena cache browser
        const res = await fetch('./data-lokasi.json?t=' + Date.now());
        const data = await res.json();

        if (!data.length) {
          container.innerHTML = '<p>Belum ada data lokasi.</p>';
          return;
        }

        container.innerHTML = data.slice().reverse().map((item, i) => `
          <div class="card">
            <div class="time">#${data.length - i} • ${item.waktu || '-'}</div>
            <div class="coord">Koordinat: ${item.lat}, ${item.lng} (Akurasi ±${item.akurasi || '-'}m)</div>
            <a class="btn" href="${item.mapsUrl}" target="_blank" rel="noopener">Buka di Google Maps</a>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<p>Gagal memuat data lokasi.</p>';
      }
    }
    muatLokasi();
  </script>
</body>
</html>
