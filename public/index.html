<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0b0e;
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: #12141c;
      border-bottom: 1px solid #1e2230;
      flex-wrap: wrap;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fe2c55;
      box-shadow: 0 0 10px #fe2c55;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 680px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 160px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2b3042;
      background: #0a0b0e;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #fe2c55; }
    select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #2b3042;
      background: #1b1f2d;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #262b3d; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.primary {
      background: #fe2c55;
      border-color: #fe2c55;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: #e02247; }

    /* Main Monitor Area */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #000;
    }
    .stage {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Overlay Info di Layar Monitor */
    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      z-index: 4;
    }
    .streamer-pill {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(15, 17, 25, 0.8);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 65%;
    }
    .streamer-pill img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .streamer-meta {
      min-width: 0;
    }
    .streamer-name {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-title {
      font-size: 0.78rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-badge {
      background: #fe2c55;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .stats-pill {
      display: none;
      gap: 14px;
      background: rgba(15, 17, 25, 0.8);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .unmute-btn {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      background: rgba(254, 44, 85, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      z-index: 6;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .placeholder {
      position: absolute;
      text-align: center;
      color: #94a3b8;
      padding: 24px;
      max-width: 460px;
      z-index: 3;
      background: rgba(10, 11, 14, 0.72);
      border-radius: 12px;
    }
    .placeholder h2 { color: #fff; margin-bottom: 8px; font-size: 1.35rem; }
    .placeholder p { line-height: 1.5; font-size: 0.95rem; }

    /* Panel Live Chat */
    .chat-panel {
      width: 340px;
      background: #12141c;
      border-left: 1px solid #1e2230;
      display: flex;
      flex-direction: column;
    }
    .chat-panel.hidden { display: none; }
    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2230;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cbd5e1;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }
    .chat-item { line-height: 1.4; word-break: break-word; }
    .chat-user { color: #38bdf8; font-weight: 600; margin-right: 6px; }
    .gift-item {
      background: rgba(254, 44, 85, 0.14);
      border: 1px solid rgba(254, 44, 85, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      color: #fda4af;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .main { flex-direction: column; }
      .chat-panel {
        width: 100%;
        height: 220px;
        border-left: none;
        border-top: 1px solid #1e2230;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>LIVE MONITOR</span>
    </div>

    <form class="controls" id="watchForm">
      <input type="text" id="usernameInput" placeholder="Masukkan username TikTok (tanpa @)" required />
      <button type="submit" class="primary" id="watchBtn">Tonton Live</button>
      <select id="qualitySelect" title="Pilih Kualitas" style="display:none;"></select>
    </form>

    <div style="display:flex; gap:8px;">
      <button id="toggleChatBtn" type="button">Sembunyikan Chat</button>
      <button id="fullscreenBtn" type="button">Layar Penuh</button>
    </div>
  </div>

  <div class="main" id="monitorContainer">
    <div class="stage" id="stageArea">
      <video id="videoPlayer" controls autoplay playsinline></video>

      <div class="hud-top">
        <div class="streamer-pill" id="streamerPill">
          <img id="streamerAvatar" src="" alt="Avatar" />
          <div class="streamer-meta">
            <div class="streamer-name" id="streamerName">-</div>
            <div class="stream-title" id="streamTitle">-</div>
          </div>
          <span class="live-badge">LIVE</span>
        </div>

        <div class="stats-pill" id="statsPill">
          <span>👁️ <strong id="viewerCount">0</strong></span>
          <span>❤️ <strong id="likeCount">0</strong></span>
        </div>
      </div>

      <button class="unmute-btn" id="unmuteBtn" type="button">🔊 Aktifkan Suara</button>

      <div class="placeholder" id="placeholder">
        <h2>Monitor TikTok Live</h2>
        <p id="statusText">Masukkan username TikTok di atas untuk menampilkan siaran langsung di layar besar.</p>
      </div>
    </div>

    <aside class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <span>Live Chat</span>
        <span id="chatStatus" style="font-size:0.75rem; color:#64748b;">Menunggu...</span>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>
  </div>

  <script>
    const form = document.getElementById('watchForm');
    const usernameInput = document.getElementById('usernameInput');
    const watchBtn = document.getElementById('watchBtn');
    const qualitySelect = document.getElementById('qualitySelect');
    const videoEl = document.getElementById('videoPlayer');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('statusText');
    const streamerPill = document.getElementById('streamerPill');
    const statsPill = document.getElementById('statsPill');
    const chatList = document.getElementById('chatList');
    const chatStatus = document.getElementById('chatStatus');
    const chatPanel = document.getElementById('chatPanel');
    const unmuteBtn = document.getElementById('unmuteBtn');

    let player = null;
    let currentStreams = [];
    let currentStreamIdx = 0;

    // Cek apakah dibuka lewat server http://localhost:3000 (bukan klik 2x file HTML)
    if (typeof io === 'undefined') {
      statusText.textContent = 'Harap buka website ini melalui http://localhost:3000 setelah menjalankan "npm start".';
    }

    const socket = typeof io !== 'undefined' ? io() : null;

    function destroyPlayer() {
      unmuteBtn.style.display = 'none';
      if (player) {
        try {
          player.pause();
          player.unload();
          player.detachMediaElement();
          player.destroy();
        } catch (_) {}
        player = null;
      }
    }

    function playStream(streamIndex) {
      destroyPlayer();

      if (typeof mpegts === 'undefined' || !mpegts.getFeatureList().mseLivePlayback) {
        statusText.textContent = 'Browser Anda tidak mendukung pemutar MSE Live (gunakan Chrome atau Edge terbaru).';
        placeholder.style.display = 'block';
        return;
      }

      const selected = currentStreams[streamIndex];
      if (!selected) return;

      currentStreamIdx = streamIndex;
      qualitySelect.value = String(streamIndex);

      player = mpegts.createPlayer(
        {
          type: 'flv',
          isLive: true,
          url: selected.proxyUrl
        },
        {
          enableWorker: true,
          enableStashBuffer: false,
          stashInitialSize: 64,
          liveBufferLatencyChasing: true,
          liveBufferLatencyMaxLatency: 1.5,
          liveBufferLatencyMinRemain: 0.3
        }
      );

      player.on(mpegts.Events.ERROR, () => {
        // Jika kualitas tertinggi gagal diputar, otomatis coba resolusi berikutnya
        if (currentStreamIdx + 1 < currentStreams.length) {
          statusText.textContent = `Kualitas ${selected.quality} gagal, mencoba ${currentStreams[currentStreamIdx + 1].quality}...`;
          placeholder.style.display = 'block';
          playStream(currentStreamIdx + 1);
        } else {
          statusText.textContent = 'Aliran video terputus atau format tidak didukung browser.';
          placeholder.style.display = 'block';
        }
      });

      player.attachMediaElement(videoEl);
      player.load();
      player.play().catch(() => {
        videoEl.muted = true;
        unmuteBtn.style.display = 'block';
        player.play().catch(() => {});
      });
    }

    // Sembunyikan teks loading saat frame video benar-benar mulai muncul
    videoEl.addEventListener('playing', () => {
      placeholder.style.display = 'none';
      if (videoEl.muted) {
        unmuteBtn.style.display = 'block';
      }
    });

    videoEl.addEventListener('volumechange', () => {
      if (!videoEl.muted) {
        unmuteBtn.style.display = 'none';
      }
    });

    unmuteBtn.addEventListener('click', () => {
      videoEl.muted = false;
      videoEl.play().catch(() => {});
      unmuteBtn.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.replace(/^@/, '').trim();
      if (!username) return;

      destroyPlayer();
      currentStreams = [];
      placeholder.style.display = 'block';
      statusText.textContent = `Mencari siaran langsung @${username}...`;
      streamerPill.style.display = 'none';
      statsPill.style.display = 'none';
      qualitySelect.style.display = 'none';
      chatList.innerHTML = '';
      chatStatus.textContent = 'Menghubungkan...';
      watchBtn.disabled = true;

      try {
        const res = await fetch(`/api/live/${encodeURIComponent(username)}`);
        const data = await res.json();

        if (!res.ok || !data.isLive) {
          statusText.textContent = data.error || `@${username} sedang offline.`;
          chatStatus.textContent = 'Offline';
          return;
        }

        const sec = ((data.elapsedMs || 0) / 1000).toFixed(2);
        statusText.textContent = `Terdeteksi dalam ${sec} detik! Memuat video...`;

        document.getElementById('streamerName').textContent = `${data.nickname} (@${data.username})`;
        document.getElementById('streamTitle').textContent = data.title || 'TikTok LIVE';
        document.getElementById('streamerAvatar').src = data.avatar || 'https://placehold.co/64x64?text=TT';
        document.getElementById('viewerCount').textContent = (data.viewerCount || 0).toLocaleString('id-ID');
        document.getElementById('likeCount').textContent = '0';
        streamerPill.style.display = 'flex';
        statsPill.style.display = 'flex';

        currentStreams = data.streams || [];
        qualitySelect.innerHTML = '';
        currentStreams.forEach((s, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = s.quality.replace('_', ' ');
          qualitySelect.appendChild(opt);
        });

        if (currentStreams.length > 0) {
          qualitySelect.style.display = 'inline-block';
          playStream(0);
        } else {
          statusText.textContent = 'Stream video tidak tersedia.';
        }

        if (socket) {
          socket.emit('watch', { username, roomId: data.roomId });
        }
      } catch (err) {
        statusText.textContent = 'Terjadi kesalahan koneksi ke server lokal.';
      } finally {
        watchBtn.disabled = false;
      }
    });

    qualitySelect.addEventListener('change', () => {
      const idx = Number(qualitySelect.value);
      if (!Number.isNaN(idx)) {
        placeholder.style.display = 'block';
        statusText.textContent = 'Mengganti resolusi...';
        playStream(idx);
      }
    });

    document.getElementById('toggleChatBtn').addEventListener('click', (e) => {
      chatPanel.classList.toggle('hidden');
      e.target.textContent = chatPanel.classList.contains('hidden') ? 'Tampilkan Chat' : 'Sembunyikan Chat';
    });

    function toggleFullscreen() {
      const container = document.getElementById('monitorContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    videoEl.addEventListener('dblclick', toggleFullscreen);

    function appendMessage(el) {
      chatList.appendChild(el);
      if (chatList.children.length > 150) {
        chatList.removeChild(chatList.firstChild);
      }
      chatList.scrollTop = chatList.scrollHeight;
    }

    if (socket) {
      socket.on('chat', (data) => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        const userSpan = document.createElement('span');
        userSpan.className = 'chat-user';
        userSpan.textContent = data.nickname;
        div.appendChild(userSpan);
        div.appendChild(document.createTextNode(data.comment));
        appendMessage(div);
      });

      socket.on('gift', (data) => {
        const div = document.createElement('div');
        div.className = 'gift-item';
        div.textContent = `🎁 ${data.user} mengirim ${data.giftName} x${data.repeatCount}`;
        appendMessage(div);
      });

      socket.on('viewerCount', (count) => {
        document.getElementById('viewerCount').textContent = Number(count).toLocaleString('id-ID');
      });

      socket.on('likeCount', (count) => {
        document.getElementById('likeCount').textContent = Number(count).toLocaleString('id-ID');
      });

      socket.on('chatStatus', (msg) => {
        chatStatus.textContent = msg;
      });

      socket.on('streamEnd', () => {
        statusText.textContent = 'Siaran langsung telah berakhir.';
        placeholder.style.display = 'block';
        destroyPlayer();
      });
    }
  </script>
</body>
</html>
