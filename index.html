<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Lokasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 64px;
            height: 64px;
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        h1 { font-size: 20px; margin-bottom: 12px; color: #fff; }
        p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .privacy-note { font-size: 11px; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">📍</div>
    <h1>Bagikan Lokasi Anda</h1>
    <p>Halaman ini memerlukan izin akses lokasi GPS Anda untuk keperluan verifikasi kehadiran / pengiriman titik temu.</p>
    
    <div class="input-group">
        <label for="userName">Nama / Keterangan (Opsional)</label>
        <input type="text" id="userName" placeholder="Masukkan nama Anda...">
    </div>

    <button id="btnShare" class="btn" onclick="requestLocation()">Izinkan & Bagikan Lokasi</button>
    
    <div id="statusBox" class="status"></div>
    <div class="privacy-note">Data lokasi hanya dikirim setelah Anda menekan tombol setuju dan mengizinkan prompt browser.</div>
</div>

<script>
    // ================= KONFIGURASI JSONSTORAGE =================
    const JSON_URL = "GANTI_DENGAN_ENDPOINT_URL_JSONSTORAGE_ANDA"; 
    const API_KEY  = "GANTI_DENGAN_API_KEY_ANDA"; 
    // ============================================================

    const btnShare = document.getElementById('btnShare');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }

    function requestLocation() {
        if (!navigator.geolocation) {
            showStatus("Browser Anda tidak mendukung fitur lokasi (GPS).", "error");
            return;
        }

        btnShare.disabled = true;
        btnShare.textContent = "Meminta izin lokasi...";

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                btnShare.textContent = "Menyimpan data...";
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const acc = Math.round(position.coords.accuracy);
                const nama = document.getElementById('userName').value.trim() || "Anonim";

                await saveToJsonStorage({
                    id: Date.now(),
                    nama: nama,
                    lat: lat,
                    lng: lng,
                    akurasi: acc + " meter",
                    waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                    perangkat: navigator.userAgent
                });
            },
            (error) => {
                btnShare.disabled = false;
                btnShare.textContent = "Izinkan & Bagikan Lokasi";
                let errMsg = "Akses lokasi ditolak oleh pengguna.";
                if (error.code === error.POSITION_UNAVAILABLE) errMsg = "Informasi lokasi tidak tersedia.";
                if (error.code === error.TIMEOUT) errMsg = "Waktu permintaan lokasi habis.";
                showStatus(errMsg, "error");
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    async function saveToJsonStorage(newEntry) {
        try {
            // 1. Ambil data lama terlebih dahulu
            const getRes = await fetch(JSON_URL);
            let currentData = { logs: [] };
            if (getRes.ok) {
                const parsed = await getRes.json();
                if (parsed && Array.isArray(parsed.logs)) {
                    currentData = parsed;
                }
            }

            // 2. Tambahkan data baru di urutan paling atas
            currentData.logs.unshift(newEntry);

            // 3. Simpan kembali ke JSONStorage menggunakan PUT
            const putUrl = `${JSON_URL}?apiKey=${API_KEY}`;
            const putRes = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentData)
            });

            if (putRes.ok) {
                btnShare.textContent = "Lokasi Terkirim ✓";
                showStatus("Terima kasih! Lokasi Anda berhasil diverifikasi dan dikirim.", "success");
            } else {
                throw new Error("Gagal menyimpan ke server.");
            }
        } catch (err) {
            btnShare.disabled = false;
            btnShare.textContent = "Coba Lagi";
            showStatus("Terjadi kesalahan koneksi saat menyimpan data.", "error");
            console.error(err);
        }
    }
</script>

</body>
</html>
