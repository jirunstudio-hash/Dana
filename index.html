<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kamera & Lokasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px 22px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
        .input-group input {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .camera-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .cam-placeholder {
            font-size: 13px;
            color: #64748b;
            padding: 16px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-cam { background: #3b82f6; color: #fff; }
        .btn-cam:hover { background: #2563eb; }
        .btn-send { background: #10b981; color: #fff; display: none; }
        .btn-send:hover { background: #059669; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .status {
            margin-top: 10px;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .privacy-note { font-size: 11px; color: #64748b; margin-top: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📷 Verifikasi Kamera & Lokasi</h1>
    <p>Aktifkan kamera dan ambil foto verifikasi. Lokasi GPS juga akan disertakan jika diizinkan.</p>

    <div class="input-group">
        <label for="userName">Nama / Keterangan (Opsional)</label>
        <input type="text" id="userName" placeholder="Masukkan nama Anda...">
    </div>

    <div class="camera-box">
        <div id="camPlaceholder" class="cam-placeholder">Kamera belum aktif</div>
        <video id="videoPreview" autoplay playsinline muted></video>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <button id="btnStartCam" class="btn btn-cam" onclick="startCamera()">1. Izinkan & Aktifkan Kamera</button>
    <button id="btnCaptureSend" class="btn btn-send" onclick="captureAndSend()">2. Ambil Foto & Kirim</button>

    <div id="statusBox" class="status"></div>
    <div class="privacy-note">Kamera dan lokasi hanya diakses setelah Anda menyetujui permintaan izin di browser.</div>
</div>

<script>
    const JSON_URL = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY  = "b3b1f259-fdd1-4906-b083-51fe497ffd59";

    let stream = null;
    const video = document.getElementById('videoPreview');
    const canvas = document.getElementById('captureCanvas');
    const placeholder = document.getElementById('camPlaceholder');
    const btnStartCam = document.getElementById('btnStartCam');
    const btnCaptureSend = document.getElementById('btnCaptureSend');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }

    async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatus("Browser tidak mendukung akses kamera.", "error");
            return;
        }

        btnStartCam.disabled = true;
        btnStartCam.textContent = "Meminta izin kamera...";

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = stream;
            video.style.display = "block";
            placeholder.style.display = "none";
            btnStartCam.style.display = "none";
            btnCaptureSend.style.display = "block";
            showStatus("Kamera aktif. Silakan tekan tombol Ambil Foto & Kirim.", "success");
        } catch (err) {
            btnStartCam.disabled = false;
            btnStartCam.textContent = "1. Izinkan & Aktifkan Kamera";
            showStatus("Izin kamera ditolak atau kamera tidak tersedia.", "error");
        }
    }

    function getOptionalLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ lat: null, lng: null, akurasi: "Tidak didukung" });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        akurasi: Math.round(pos.coords.accuracy) + " meter"
                    });
                },
                () => {
                    resolve({ lat: null, lng: null, akurasi: "Tidak diizinkan" });
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        });
    }

    function capturePhotoBase64() {
        const targetW = 480;
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const targetH = Math.round((vh / vw) * targetW);

        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, targetW, targetH);

        // Kompres JPEG agar ukuran tetap ringan untuk JSONStorage
        return canvas.toDataURL('image/jpeg', 0.55);
    }

    async function captureAndSend() {
        if (!stream) {
            showStatus("Aktifkan kamera terlebih dahulu.", "error");
            return;
        }

        btnCaptureSend.disabled = true;
        btnCaptureSend.textContent = "Mengambil foto & mengirim...";

        try {
            const fotoBase64 = capturePhotoBase64();
            const loc = await getOptionalLocation();
            const nama = document.getElementById('userName').value.trim() || "Anonim";

            // Matikan kamera setelah foto diambil
            stream.getTracks().forEach(track => track.stop());
            video.style.display = "none";
            placeholder.style.display = "block";
            placeholder.textContent = "Foto sudah diambil";

            const payload = {
                id: Date.now(),
                nama: nama,
                foto: fotoBase64,
                lat: loc.lat,
                lng: loc.lng,
                akurasi: loc.akurasi,
                waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
                perangkat: navigator.userAgent
            };

            const getRes = await fetch(`${JSON_URL}?t=${Date.now()}`);
            let currentData = { logs: [] };
            if (getRes.ok) {
                const parsed = await getRes.json();
                if (parsed && Array.isArray(parsed.logs)) {
                    currentData = parsed;
                }
            }

            currentData.logs.unshift(payload);

            const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
            const putRes = await fetch(putUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentData)
            });

            if (putRes.ok) {
                btnCaptureSend.textContent = "Terkirim ✓";
                showStatus("Foto dan data verifikasi berhasil dikirim.", "success");
            } else {
                throw new Error("Gagal menyimpan ke JSONStorage");
            }
        } catch (err) {
            btnCaptureSend.disabled = false;
            btnCaptureSend.textContent = "Coba Kirim Ulang";
            showStatus("Gagal mengirim data. Pastikan koneksi stabil dan ukuran data tidak terlalu besar.", "error");
            console.error(err);
        }
    }
</script>

</body>
</html>
