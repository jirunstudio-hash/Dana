<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#118EEA" />
  <title>DANA ID | Customer Care DANA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --dpr: 1;
      --ui-scale: 1;
      --saldo-top: 1.5%;
      --saldo-left: 8.2%;
      --saldo-font: 16px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Layar Pembuka Logo Tanpa Spinner Berputar */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #118eea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #splashScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: calc(min(42vw, 165px) * var(--ui-scale));
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }

    /* Wadah Utama Menyesuaikan Perangkat */
    .device-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #118eea;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .device-stage.show {
      display: flex;
    }

    /* Mode HP: memenuhi layar HP secara proporsional */
    body[data-device="mobile"] .device-stage {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      border-radius: 0;
    }

    /* Mode Tablet / Desktop: bingkai potret terpusat agar tidak melebar */
    body[data-device="desktop"] .device-stage,
    body[data-device="tablet"] .device-stage {
      width: auto;
      height: 96dvh;
      aspect-ratio: 9 / 19.5;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateZ(0);
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      transform: translateZ(0);
    }

    /* Overlay Saldo Rp 50.000.000 Tajam di Layar Beresolusi Tinggi */
    .saldo-overlay {
      position: absolute;
      top: var(--saldo-top);
      left: var(--saldo-left);
      width: 47%;
      height: 3.4%;
      background: #138ee9;
      border-radius: 4px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-weight: 700;
      font-size: var(--saldo-font);
      line-height: 1;
      letter-spacing: 0.2px;
      z-index: 10;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .saldo-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-rendering: geometricPrecision;
    }

    .eye-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.94);
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-svg {
      width: calc(var(--saldo-font) * 1.05);
      height: calc(var(--saldo-font) * 1.05);
      display: block;
      shape-rendering: geometricPrecision;
    }
  </style>
</head>
<body>
  <!-- Layar Pembuka Logo Tanpa Spinner -->
  <div id="splashScreen">
    <img
      src="https://dev-danapemulihan.pantheonsite.io/asset/img/dana_text.png"
      alt="Logo"
      class="splash-logo"
      decoding="sync"
    />
  </div>

  <!-- Tampilan Utama Responsif Sesuai Perangkat & Resolusi Tinggi -->
  <div class="device-stage" id="deviceStage">
    <div class="art-frame">
      <img
        src="https://b.top4top.io/p_398241nn01.jpeg"
        alt="Dashboard"
        class="art-img"
        decoding="sync"
        fetchpriority="high"
      />
      <div class="saldo-overlay">
        <span class="saldo-text" id="saldoValue">Rp 50.000.000</span>
        <button type="button" class="eye-toggle" id="eyeBtn" aria-label="Tampilkan atau sembunyikan saldo" title="Tampilkan/Sembunyikan">
          <svg id="eyeIconOpen" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5-9.5-6.5-9.5-6.5z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <svg id="eyeIconClosed" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M10.6 5.6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15.4 15.4 0 0 1-3.2 4.1" />
            <path d="M6.4 6.4A15.8 15.8 0 0 0 2.5 12s3.5 6.5 9.5 6.5c1.7 0 3.2-.4 4.5-1.1" />
            <line x1="3" y1="3" x2="21" y2="21" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const splash = document.getElementById("splashScreen");
      const stage = document.getElementById("deviceStage");
      const saldoEl = document.getElementById("saldoValue");
      const eyeBtn = document.getElementById("eyeBtn");
      const eyeOpen = document.getElementById("eyeIconOpen");
      const eyeClosed = document.getElementById("eyeIconClosed");

      const SALDO_NOMINAL = "Rp 50.000.000";
      let isMasked = false;

      function detectAndAdaptDevice() {
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const dpr = Number(window.devicePixelRatio || 1);
        const approxDpi = Math.round(dpr * 96);
        const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

        let deviceType = "mobile";
        if (vw >= 1024 && !isTouch) {
          deviceType = "desktop";
        } else if (vw >= 650 && vw < 1024) {
          deviceType = "tablet";
        } else {
          deviceType = "mobile";
        }

        const ratioWidth = deviceType === "mobile" ? vw : Math.min(vw, vh * (9 / 19.5));
        const dpiFactor = dpr >= 3 ? 0.96 : dpr >= 2 ? 1.0 : 1.04;
        const computedFont = Math.max(12, Math.min(18, Math.round(ratioWidth * 0.041 * dpiFactor)));
        const uiScale = dpr >= 3 ? 1.04 : 1.0;

        const aspect = vh / Math.max(vw, 1);
        const topPercent = aspect > 2.15 ? "1.65%" : "1.5%";

        document.body.setAttribute("data-device", deviceType);
        document.body.setAttribute("data-dpr", String(dpr));
        document.body.setAttribute("data-dpi", String(approxDpi));

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--dpr", String(dpr));
        rootStyle.setProperty("--ui-scale", String(uiScale));
        rootStyle.setProperty("--saldo-font", computedFont + "px");
        rootStyle.setProperty("--saldo-top", topPercent);
      }

      detectAndAdaptDevice();
      window.addEventListener("resize", detectAndAdaptDevice);
      window.addEventListener("orientationchange", function () {
        setTimeout(detectAndAdaptDevice, 150);
      });

      setTimeout(function () {
        splash.classList.add("hide");
        stage.classList.add("show");
        setTimeout(function () {
          splash.style.display = "none";
        }, 350);
      }, 1200);

      eyeBtn.addEventListener("click", function () {
        isMasked = !isMasked;
        saldoEl.textContent = isMasked ? "Rp ••••••••" : SALDO_NOMINAL;
        eyeOpen.style.display = isMasked ? "none" : "block";
        eyeClosed.style.display = isMasked ? "block" : "none";
      });
    })();
  </script>
</body>
</html>
