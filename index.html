
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Safety - Member</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="member-container">
  <div class="logo">FAMILY<span>SAFETY</span></div>

  <div class="member-card">
    <div class="device-icon">📱</div>
    <h2>Hubungkan Perangkat</h2>
    <p>
      Bagikan lokasi perangkat kepada admin keluarga
      setelah memberikan persetujuan.
    </p>

    <label>Nama perangkat</label>
    <input id="deviceName" placeholder="Contoh: HP Anak 1">

    <div class="permission">
      <strong>Persetujuan lokasi</strong>
      <p>Lokasi hanya dibagikan ketika kamu mengaktifkannya.</p>
    </div>

    <button id="startBtn" onclick="startSharing()">
      Izinkan & Bagikan Lokasi
    </button>

    <button id="stopBtn" class="secondary" onclick="stopSharing()" disabled>
      Hentikan Berbagi
    </button>

    <div id="status">Belum terhubung</div>
    <div id="location"></div>
  </div>
</div>

<script>
let watchId = null;

function startSharing() {
  const name = document.getElementById("deviceName").value.trim();

  if (!name) {
    alert("Masukkan nama perangkat.");
    return;
  }

  if (!navigator.geolocation) {
    alert("Browser tidak mendukung GPS.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      watchId = navigator.geolocation.watchPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          document.getElementById("status").textContent =
            "Lokasi sedang dibagikan";

          document.getElementById("location").innerHTML =
            `Latitude: ${lat.toFixed(6)}<br>
             Longitude: ${lng.toFixed(6)}<br>
             <a target="_blank" rel="noopener"
             href="https://www.google.com/maps?q=${lat},${lng}">
             Lihat lokasi di peta</a>`;
        },
        error => {
          document.getElementById("status").textContent =
            "Gagal mendapatkan lokasi: " + error.message;
        },
        { enableHighAccuracy: true, maximumAge: 5000 }
      );

      document.getElementById("startBtn").disabled = true;
      document.getElementById("stopBtn").disabled = false;
    },
    error => alert("Izin lokasi gagal: " + error.message),
    { enableHighAccuracy: true }
  );
}

function stopSharing() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.getElementById("status").textContent =
    "Berbagi lokasi dihentikan";

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}
</script>

</body>
</html>
