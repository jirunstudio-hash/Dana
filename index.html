<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS School Demo - Pengirim</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>GPS School Demo</h2>
  <p>Tekan tombol di bawah untuk mengizinkan pengiriman koordinat ke panel demo.</p>
  <button id="btnStart" style="padding: 12px 20px; font-size: 16px;">Mulai Bagikan Lokasi</button>
  <pre id="status" style="background: #f4f4f4; padding: 10px; margin-top: 15px;">Status: Menunggu izin...</pre>

  <script>
    // Ganti dengan URL Firebase Realtime Database Anda
    const FIREBASE_DB_URL = "https://NAMA-PROJECT-ANDA.firebaseio.com/gps_demo.json";

    document.getElementById('btnStart').addEventListener('click', () => {
      const statusEl = document.getElementById('status');

      if (!navigator.geolocation) {
        statusEl.textContent = "Browser tidak mendukung Geolocation.";
        return;
      }

      statusEl.textContent = "Meminta izin lokasi...";

      navigator.geolocation.watchPosition(
        async (position) => {
          const payload = {
            project: "GPS School Demo",
            device: {
              platform: navigator.platform || "Web Browser",
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
              updatedAt: new Date().toISOString(),
              active: true
            }
          };

          statusEl.textContent = JSON.stringify(payload, null, 2);

          // Kirim ke Firebase via REST API
          await fetch(FIREBASE_DB_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        },
        (error) => {
          statusEl.textContent = "Gagal mendapatkan lokasi: " + error.message;
        },
        { enableHighAccuracy: true }
      );
    });
  </script>
</body>
</html>
