<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#118EEA" />
  <title>DANA ID | Customer Care DANA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --dpr: 1;
      --ui-scale: 1;
      --saldo-top: 1.5%;
      --saldo-left: 8.2%;
      --saldo-font: 16px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Layar Pembuka Logo Tanpa Spinner Berputar */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #118eea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #splashScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: calc(min(42vw, 165px) * var(--ui-scale));
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }

    /* Wadah Utama Menyesuaikan Perangkat */
    .device-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #118eea;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .device-stage.show {
      display: flex;
    }

    /* Mode HP: memenuhi layar HP secara proporsional */
    body[data-device="mobile"] .device-stage {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      border-radius: 0;
    }

    /* Mode Tablet / Desktop: bingkai potret terpusat agar tidak melebar */
    body[data-device="desktop"] .device-stage,
    body[data-device="tablet"] .device-stage {
      width: auto;
      height: 96dvh;
      aspect-ratio: 9 / 19.5;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
    }

    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateZ(0);
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      filter: contrast(1.04) saturate(1.03);
      transform: translateZ(0);
    }

    /* Overlay Saldo Rp 50.000.000 Tajam di Layar Beresolusi Tinggi */
    .saldo-overlay {
      position: absolute;
      top: var(--saldo-top);
      left: var(--saldo-left);
      width: 47%;
      height: 3.4%;
      background: #138ee9;
      border-radius: 4px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-weight: 700;
      font-size: var(--saldo-font);
      line-height: 1;
      letter-spacing: 0.2px;
      z-index: 10;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .saldo-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-rendering: geometricPrecision;
    }

    .eye-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.94);
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-svg {
      width: calc(var(--saldo-font) * 1.05);
      height: calc(var(--saldo-font) * 1.05);
      display: block;
      shape-rendering: geometricPrecision;
    }

    /* Hotspot klik pada ikon "Kirim" di dashboard */
    .hotspot-kirim {
      position: absolute;
      top: 6.4%;
      left: 57.5%;
      width: 16%;
      height: 5.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 12;
      -webkit-tap-highlight-color: transparent;
    }

    /* Layar Saat Ikon Kirim Ditekan */
    .kirim-screen,
    .detail-kirim-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: none;
      transform: translateZ(0);
    }

    .kirim-screen {
      z-index: 25;
    }

    .detail-kirim-screen {
      z-index: 35;
    }

    .kirim-screen.active,
    .detail-kirim-screen.active {
      display: block;
    }

    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      filter: contrast(1.04) saturate(1.03);
    }

    /* Hotspot transparan di atas ikon panah kembali asli pada gambar */
    .hotspot-back {
      position: absolute;
      top: 1.5%;
      left: 2.5%;
      width: 12%;
      height: 5.2%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 30;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot-back-detail {
      position: absolute;
      top: 1.5%;
      left: 2.5%;
      width: 12%;
      height: 5.2%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 40;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hotspot kotak panjang pencarian berikon kaca pembesar di bawah "Kirim Cepat" */
    .hotspot-kirim-cepat-box {
      position: absolute;
      top: 19.2%;
      left: 3.5%;
      width: 93%;
      height: 5.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 28;
      -webkit-tap-highlight-color: transparent;
    }

    /* Mode Kalibrasi Visual Hotspot */
    body.debug-hotspots .hotspot-kirim,
    body.debug-hotspots .hotspot-back,
    body.debug-hotspots .hotspot-back-detail,
    body.debug-hotspots .hotspot-kirim-cepat-box {
      background: rgba(239, 68, 68, 0.25);
      border: 1.5px dashed #ef4444;
    }

    .coord-badge {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      color: #38bdf8;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      z-index: 99999;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    body.debug-hotspots .coord-badge {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Layar Pembuka Logo Tanpa Spinner -->
  <div id="splashScreen">
    <img
      src="https://dev-danapemulihan.pantheonsite.io/asset/img/dana_text.png"
      alt="Logo"
      class="splash-logo"
      decoding="sync"
    />
  </div>

  <!-- Tampilan Utama Responsif Sesuai Perangkat & Resolusi Tinggi -->
  <div class="device-stage" id="deviceStage">
    <div class="art-frame" id="dashboardView">
      <img
        id="dashboardBg"
        src="https://b.top4top.io/p_398241nn01.jpeg"
        alt="Dashboard"
        class="art-img"
        decoding="sync"
        fetchpriority="high"
      />
      <div class="saldo-overlay">
        <span class="saldo-text" id="saldoValue">Rp 50.000.000</span>
        <button type="button" class="eye-toggle" id="eyeBtn" aria-label="Tampilkan atau sembunyikan saldo" title="Tampilkan/Sembunyikan">
          <svg id="eyeIconOpen" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5-9.5-6.5-9.5-6.5z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <svg id="eyeIconClosed" class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M10.6 5.6A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15.4 15.4 0 0 1-3.2 4.1" />
            <path d="M6.4 6.4A15.8 15.8 0 0 0 2.5 12s3.5 6.5 9.5 6.5c1.7 0 3.2-.4 4.5-1.1" />
            <line x1="3" y1="3" x2="21" y2="21" />
          </svg>
        </button>
      </div>

      <!-- Tombol Klik Area Ikon "Kirim" -->
      <button type="button" class="hotspot-kirim" id="btnKirim" aria-label="Kirim" title="Kirim"></button>
    </div>

    <!-- Layar Saat Ikon Kirim Ditekan -->
    <div class="kirim-screen" id="kirimScreen">
      <button type="button" class="hotspot-back" id="btnBackDashboard" aria-label="Kembali" title="Kembali"></button>
      <button type="button" class="hotspot-kirim-cepat-box" id="btnKirimCepatBox" aria-label="Pencarian Kirim Cepat" title="Pencarian Kirim Cepat"></button>
      <img
        id="kirimBg"
        src="https://e.top4top.io/p_3982onn2m1.jpeg"
        alt="Layar Kirim"
        class="screen-img"
        decoding="async"
      />
    </div>

    <!-- Layar Saat Kotak Pencarian di Bawah Kirim Cepat Ditekan -->
    <div class="detail-kirim-screen" id="detailKirimScreen">
      <button type="button" class="hotspot-back-detail" id="btnBackKirim" aria-label="Kembali" title="Kembali"></button>
      <img
        id="detailKirimBg"
        src="https://i.top4top.io/p_3982qb9h61.jpeg"
        alt="Layar Detail Kirim Cepat"
        class="screen-img"
        decoding="async"
      />
    </div>
  </div>

  <div class="coord-badge" id="coordBadge">Tap layar untuk cek koordinat %</div>

  <script>
    (function () {
      const DEBUG_HOTSPOTS = true; // Ubah ke false setelah posisi kotak dirasa sudah pas
      const DASHBOARD_IMAGE_URL = "https://b.top4top.io/p_398241nn01.jpeg";
      const KIRIM_IMAGE_URL = "https://e.top4top.io/p_3982onn2m1.jpeg";
      const DETAIL_KIRIM_IMAGE_URL = "https://i.top4top.io/p_3982qb9h61.jpeg";
      const SALDO_NOMINAL = "Rp 50.000.000";

      const splash = document.getElementById("splashScreen");
      const stage = document.getElementById("deviceStage");
      const bgImg = document.getElementById("dashboardBg");
      const kirimImg = document.getElementById("kirimBg");
      const detailKirimImg = document.getElementById("detailKirimBg");
      const kirimScreen = document.getElementById("kirimScreen");
      const detailKirimScreen = document.getElementById("detailKirimScreen");
      const btnKirim = document.getElementById("btnKirim");
      const btnBackDashboard = document.getElementById("btnBackDashboard");
      const btnKirimCepatBox = document.getElementById("btnKirimCepatBox");
      const btnBackKirim = document.getElementById("btnBackKirim");
      const saldoEl = document.getElementById("saldoValue");
      const eyeBtn = document.getElementById("eyeBtn");
      const eyeOpen = document.getElementById("eyeIconOpen");
      const eyeClosed = document.getElementById("eyeIconClosed");
      const coordBadge = document.getElementById("coordBadge");

      if (DEBUG_HOTSPOTS) {
        document.body.classList.add("debug-hotspots");
      }

      if (bgImg && bgImg.src !== DASHBOARD_IMAGE_URL) {
        bgImg.src = DASHBOARD_IMAGE_URL;
      }
      if (kirimImg && kirimImg.src !== KIRIM_IMAGE_URL) {
        kirimImg.src = KIRIM_IMAGE_URL;
      }
      if (detailKirimImg && detailKirimImg.src !== DETAIL_KIRIM_IMAGE_URL) {
        detailKirimImg.src = DETAIL_KIRIM_IMAGE_URL;
      }

      const preloadKirim = new Image();
      preloadKirim.src = KIRIM_IMAGE_URL;
      const preloadDetail = new Image();
      preloadDetail.src = DETAIL_KIRIM_IMAGE_URL;

      let isMasked = false;

      function detectAndAdaptDevice() {
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const dpr = Number(window.devicePixelRatio || 1);
        const approxDpi = Math.round(dpr * 96);
        const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

        let deviceType = "mobile";
        if (vw >= 1024 && !isTouch) {
          deviceType = "desktop";
        } else if (vw >= 650 && vw < 1024) {
          deviceType = "tablet";
        } else {
          deviceType = "mobile";
        }

        const ratioWidth = deviceType === "mobile" ? vw : Math.min(vw, vh * (9 / 19.5));
        const dpiFactor = dpr >= 3 ? 0.96 : dpr >= 2 ? 1.0 : 1.04;
        const computedFont = Math.max(12, Math.min(18, Math.round(ratioWidth * 0.041 * dpiFactor)));
        const uiScale = dpr >= 3 ? 1.04 : 1.0;

        const aspect = vh / Math.max(vw, 1);
        const topPercent = aspect > 2.15 ? "1.65%" : "1.5%";

        document.body.setAttribute("data-device", deviceType);
        document.body.setAttribute("data-dpr", String(dpr));
        document.body.setAttribute("data-dpi", String(approxDpi));

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--dpr", String(dpr));
        rootStyle.setProperty("--ui-scale", String(uiScale));
        rootStyle.setProperty("--saldo-font", computedFont + "px");
        rootStyle.setProperty("--saldo-top", topPercent);
      }

      detectAndAdaptDevice();
      window.addEventListener("resize", detectAndAdaptDevice);
      window.addEventListener("orientationchange", function () {
        setTimeout(detectAndAdaptDevice, 150);
      });

      setTimeout(function () {
        splash.classList.add("hide");
        stage.classList.add("show");
        setTimeout(function () {
          splash.style.display = "none";
        }, 350);
      }, 1200);

      eyeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        isMasked = !isMasked;
        saldoEl.textContent = isMasked ? "Rp ••••••••" : SALDO_NOMINAL;
        eyeOpen.style.display = isMasked ? "none" : "block";
        eyeClosed.style.display = isMasked ? "block" : "none";
      });

      btnKirim.addEventListener("click", function () {
        kirimScreen.classList.add("active");
      });

      btnBackDashboard.addEventListener("click", function () {
        detailKirimScreen.classList.remove("active");
        kirimScreen.classList.remove("active");
      });

      btnKirimCepatBox.addEventListener("click", function () {
        detailKirimScreen.classList.add("active");
      });

      btnBackKirim.addEventListener("click", function () {
        detailKirimScreen.classList.remove("active");
      });

      if (DEBUG_HOTSPOTS && stage && coordBadge) {
        stage.addEventListener("pointerdown", function (e) {
          const rect = stage.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const xPct = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
          const yPct = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
          coordBadge.textContent = "left: " + xPct + "% | top: " + yPct + "%";
        });
      }
    })();
  </script>
</body>
</html>
