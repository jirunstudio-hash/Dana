<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#118EEA" />
  <title>DANA ID | Customer Care DANA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Layar Pembuka Tanpa Spinner Berputar */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #118eea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #splashScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: min(42vw, 160px);
      height: auto;
    }

    /* Wadah responsif menyesuaikan ukuran layar perangkat */
    .device-stage {
      position: relative;
      width: min(100vw, 440px);
      height: min(100dvh, 950px);
      max-width: 100vw;
      max-height: 100dvh;
      background: #118eea;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .device-stage.show {
      display: flex;
    }

    /* Bingkai rasio gambar agar posisi overlay saldo selalu presisi */
    .art-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Overlay saldo Rp 50.000.000 skala proporsional */
    .saldo-overlay {
      position: absolute;
      top: 1.5%;
      left: 8.2%;
      width: 46%;
      height: 3.4%;
      background: #138ee9;
      border-radius: 4px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(13px, 3.8vw, 17px);
      line-height: 1;
      letter-spacing: 0.2px;
      z-index: 10;
    }

    .saldo-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eye-toggle {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.92);
      font-size: clamp(12px, 3.3vw, 14px);
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Penyesuaian khusus layar lebar (tablet/desktop) */
    @media (min-width: 600px) {
      .device-stage {
        width: auto;
        height: 96dvh;
        aspect-ratio: 9 / 19.5;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Layar Logo Tanpa Spinner -->
  <div id="splashScreen">
    <img
      src="https://dev-danapemulihan.pantheonsite.io/asset/img/dana_text.png"
      alt="Logo"
      class="splash-logo"
    />
  </div>

  <!-- Tampilan Utama Responsif -->
  <div class="device-stage" id="deviceStage">
    <div class="art-frame">
      <img
        src="https://b.top4top.io/p_398241nn01.jpeg"
        alt="Dashboard"
        class="art-img"
      />
      <div class="saldo-overlay">
        <span class="saldo-text" id="saldoValue">Rp 50.000.000</span>
        <button type="button" class="eye-toggle" id="eyeBtn" title="Tampilkan/Sembunyikan">👁</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const splash = document.getElementById("splashScreen");
      const stage = document.getElementById("deviceStage");
      const saldoEl = document.getElementById("saldoValue");
      const eyeBtn = document.getElementById("eyeBtn");

      const SALDO_NOMINAL = "Rp 50.000.000";
      let isMasked = false;

      setTimeout(function () {
        splash.classList.add("hide");
        stage.classList.add("show");
        setTimeout(function () {
          splash.style.display = "none";
        }, 350);
      }, 1200);

      eyeBtn.addEventListener("click", function () {
        isMasked = !isMasked;
        saldoEl.textContent = isMasked ? "Rp ••••••••" : SALDO_NOMINAL;
      });
    })();
  </script>
</body>
</html>
